<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة متابعة الإدارات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./logo.png">
    
    <!-- مكتبة PapaParse لقراءة ملفات CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        /* تنسيق خلفية الصفحة */
        body { background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('./hig.png') no-repeat center center fixed; background-size: cover; color: #fff; min-height: 100vh; padding-bottom: 20px; }
        
        /* ========================================= */
        /* تنسيقات شاشة الدخول الفخمة */
        /* ========================================= */
        #loginScreen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            display: flex; justify-content: center; align-items: center; z-index: 9999; 
        }
        
        .login-box { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(15px);
            padding: 50px 40px; 
            border-radius: 20px; 
            width: 90%; max-width: 450px; 
            text-align: center; 
            border: 1px solid rgba(197, 155, 39, 0.3); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        /* لمعة زخرفية في الكارت */
        .login-box::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(197,155,39,0.1) 0%, transparent 60%);
            transform: rotate(45deg); pointer-events: none;
        }

        .login-logo {
            width: 80px; height: 80px; border-radius: 50%; background: #fff; padding: 3px;
            border: 2px solid #c59b27; margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(197, 155, 39, 0.4);
        }

        .login-box h2 { color: #fbbf24; margin-bottom: 8px; font-size: 26px; font-weight: 900; letter-spacing: 1px; }
        .login-box p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 30px; }
        
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #c59b27; font-size: 16px; pointer-events: none; }
        
        .login-box select, .login-box input { 
            width: 100%; padding: 14px 15px 14px 45px; /* مساحة للأيقونة */
            border-radius: 10px; border: 1px solid #334155; background: #0f172a; 
            color: #fff; font-family: 'Cairo'; font-size: 15px; outline: none; transition: 0.3s;
        }
        .login-box select:focus, .login-box input:focus { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,0.15); }
        
        /* تنسيق الزرار الفخم */
        .login-box button { 
            width: 100%; padding: 15px; 
            background: linear-gradient(135deg, #c59b27, #9f7a17); 
            color: #fff; border: none; border-radius: 10px; 
            font-weight: 900; cursor: pointer; font-family: 'Cairo'; font-size: 18px; 
            transition: 0.3s; box-shadow: 0 4px 15px rgba(197, 155, 39, 0.4);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .login-box button:hover { background: linear-gradient(135deg, #d4af37, #c59b27); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(197, 155, 39, 0.6); }
        .login-box button:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ========================================= */
        /* تنسيقات لوحة المتابعة */
        /* ========================================= */
        #dashboardScreen { display: none; }
        header { background: rgba(15, 23, 42, 0.95); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #c59b27; position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-area img { width: 35px; height: 35px; border-radius: 50%; background: #fff; padding: 2px; border: 1px solid #c59b27; }
        .logo-area h1 { font-size: 14px; color: #fbbf24; margin: 0; font-weight: 900; }
        .back-btn { text-decoration: none; padding: 6px 12px; border-radius: 6px; background: #c59b27; color: #0f172a; font-weight: 700; font-size: 11px; display: flex; align-items: center; gap: 5px; transition: 0.2s; cursor: pointer;}
        .back-btn:hover { background: #eab308; }
        
        .container { max-width: 1100px; margin: 15px auto; padding: 0 10px; }
        .welcome-msg { text-align: right; color: #4ade80; font-size: 16px; font-weight: 700; margin-bottom: 10px; padding-right: 5px;}
        .page-title { text-align: center; margin-bottom: 20px; color: #fbbf24; font-size: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        
        .refresh-btn { background: #0d6efd; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-family: 'Cairo'; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .refresh-btn:hover { background: #0b5ed7; }
        .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .section-title { color: #cbd5e1; font-size: 15px; margin: 20px 0 10px 0; border-right: 4px solid #c59b27; padding-right: 8px; display: flex; align-items: center; gap: 6px; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        @media (min-width: 768px) { .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; } }
        
        .stat-card { padding: 12px 8px; border-radius: 10px; text-align: center; color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.3); position: relative; overflow: hidden; }
        .stat-card h3 { font-size: 11px; margin-bottom: 5px; opacity: 0.9; z-index: 2; position: relative; font-weight: 700;}
        .stat-card .number { font-size: 24px; font-weight: 900; z-index: 2; position: relative;}
        .stat-card i { position: absolute; left: -5px; bottom: -5px; font-size: 50px; opacity: 0.1; z-index: 1; }
        
        .card-yellow { background: linear-gradient(135deg, #d97706, #b45309); }
        .card-green { background: linear-gradient(135deg, #059669, #047857); }
        .card-red { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .card-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }

        .error-msg { text-align: center; padding: 15px; color: #f87171; font-size: 14px; background: rgba(220,38,38,0.1); border-radius: 8px; margin-top: 15px; display: none;}
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen">
        <div class="login-box">
            <img src="./logo.png" alt="شعار الهيئة" class="login-logo">
            <h2>بوابة المتابعة</h2>
            <p class="subtitle">الهيئة العامة للسد العالي وخزان أسوان</p>
            
            <!-- قائمة اختيار اسم المستخدم -->
            <div class="input-group">
                <i class="fas fa-user"></i>
                <select id="loginUsername">
                    <option value="">-- جاري تحميل المستخدمين... --</option>
                </select>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="كلمة المرور">
            </div>
            
            <button id="loginBtn" onclick="checkLogin()">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
            </button>
            
            <!-- رسالة الخطأ -->
            <p id="loginError" style="color: #ef4444; font-size: 13px; margin-top: 15px; display: none; font-weight: bold;"></p>
        </div>
    </div>

    <!-- لوحة المتابعة -->
    <div id="dashboardScreen">
        <header>
            <div class="logo-area">
                <img src="./logo.png" alt="شعار">
                <h1>لوحة المتابعة المركزية</h1>
            </div>
            <a href="index.html" class="back-btn"><i class="fas fa-home"></i> الرئيسية</a>
        </header>

        <div class="container">
            <div class="welcome-msg" id="welcomeMsg"></div>
            
            <div class="page-title">
                <span><i class="fas fa-chart-pie"></i> إحصائيات حركة العمل</span>
                <button class="refresh-btn" id="refreshBtn" onclick="loadStats()"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>

            <div id="errorBox" class="error-msg"></div>

            <h2 class="section-title"><i class="fas fa-shopping-cart"></i> إدارة التعاقدات والمشتريات</h2>
            <div class="stats-grid">
                <div class="stat-card card-yellow"><h3><i class="fas fa-clock"></i> معلقة</h3><div class="number" id="purPending">-</div></div>
                <div class="stat-card card-green"><h3><i class="fas fa-check-circle"></i> معتمدة</h3><div class="number" id="purApproved">-</div></div>
                <div class="stat-card card-red"><h3><i class="fas fa-times-circle"></i> مرفوضة</h3><div class="number" id="purRejected">-</div></div>
                <div class="stat-card card-blue"><h3><i class="fas fa-list"></i> الإجمالي</h3><div class="number" id="purTotal">-</div></div>
            </div>

            <h2 class="section-title"><i class="fas fa-calendar-alt"></i> إدارة الإجازات</h2>
            <div class="stats-grid">
                <div class="stat-card card-yellow"><h3><i class="fas fa-clock"></i> معلقة</h3><div class="number" id="leavePending">-</div></div>
                <div class="stat-card card-green"><h3><i class="fas fa-check-circle"></i> معتمدة</h3><div class="number" id="leaveApproved">-</div></div>
                <div class="stat-card card-red"><h3><i class="fas fa-times-circle"></i> مرفوضة</h3><div class="number" id="leaveRejected">-</div></div>
                <div class="stat-card card-blue"><h3><i class="fas fa-list"></i> الإجمالي</h3><div class="number" id="leaveTotal">-</div></div>
            </div>
        </div>
    </div>

    <script>
        // ✅ الروابط بتاعتك
        const LEAVE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT1t4J0CU27xPKyNHRlsIYn1wDylkF6FM6rUG9TK7l8tXKW-upnje5ohCzWYIgMXHAeqRTjaDwI9EEe/pub?gid=0&single=true&output=csv";
        const PURCHASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxp-T7L4Q8VCHi5eLR4oY1FAq0vbDgJVKLphkUPeCMFeoYEeAQyCS7dUmd6STXFSK7LnTcDCk4NMTU/pub?gid=0&single=true&output=csv";
        const USERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7qyqwgacjwMEXUdYy_4GS2CYg74IzW2YYnLetmVhJyRjrC0M3AfRP5w6Uq0bYjuNuJjf9qj-B9QlN/pub?gid=667920095&single=true&output=csv";

        let currentUserName = "";

        // 1. تحميل قائمة المستخدمين في القائمة المنسدلة
        window.onload = function() {
            Papa.parse(USERS_CSV_URL + "&t=" + new Date().getTime(), {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    let select = document.getElementById('loginUsername');
                    select.innerHTML = '<option value="">-- اختر اسم المستخدم --</option>';
                    
                    results.data.forEach(row => {
                        let user = row[Object.keys(row)[0]] || "";
                        if (user) {
                            let opt = document.createElement('option');
                            opt.value = user;
                            opt.textContent = user;
                            select.appendChild(opt);
                        }
                    });
                },
                error: function(err) {
                    let select = document.getElementById('loginUsername');
                    select.innerHTML = '<option value="">-- تعذر تحميل المستخدمين --</option>';
                }
            });
        };

        // 2. التحقق من الدخول
        function checkLogin() {
            const user = document.getElementById('loginUsername').value;
            const pass = document.getElementById('loginPassword').value.trim();
            const errorMsg = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!user) {
                errorMsg.innerText = "يرجى اختيار اسم المستخدم";
                errorMsg.style.display = 'block';
                return;
            }
            if (!pass) {
                errorMsg.innerText = "يرجى إدخال كلمة المرور";
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

            Papa.parse(USERS_CSV_URL + "&t=" + new Date().getTime(), {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    let isValid = false;
                    
                    results.data.forEach(row => {
                        let dbUser = row[Object.keys(row)[0]] || "";
                        let dbPass = row[Object.keys(row)[1]] || "";
                        let dbName = row[Object.keys(row)[2]] || ""; // العمود الثالث هو الاسم
                        
                        if (dbUser.trim() === user && dbPass.trim() === pass) {
                            isValid = true;
                            currentUserName = dbName || user; 
                        }
                    });

                    if (isValid) {
                        document.getElementById('loginScreen').style.display = 'none';
                        document.getElementById('dashboardScreen').style.display = 'block';
                        document.getElementById('welcomeMsg').innerHTML = "أهلاً بك، " + currentUserName + " 👋";
                        loadStats();
                    } else {
                        errorMsg.innerText = "بيانات الدخول غير صحيحة";
                        errorMsg.style.display = 'block';
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                    }
                },
                error: function(err) {
                    errorMsg.innerText = "حدث خطأ أثناء الاتصال، يرجى المحاولة لاحقاً";
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                }
            });
        }

        // 3. جلب الإحصائيات لجميع الملفات في نفس الوقت
        function loadStats() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
            
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';
            document.querySelectorAll('.number').forEach(el => el.innerText = '...');

            const timestamp = new Date().getTime();

            // دالة مساعدة لتحميل ملف CSV وتحويله إلى بيانات باستخدام Promises
            const fetchCSV = (url) => {
                return new Promise((resolve, reject) => {
                    Papa.parse(url + "&t=" + timestamp, {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            resolve(results.data);
                        },
                        error: function(err) {
                            reject(err);
                        }
                    });
                });
            };

            // جلب الملفين معاً في نفس الوقت
            Promise.all([
                fetchCSV(LEAVE_CSV_URL),
                fetchCSV(PURCHASE_CSV_URL)
            ])
            .then(([leaveData, purchaseData]) => {
                
                // 1. معالجة بيانات الإجازات
                let leavePending = 0, leaveApproved = 0, leaveRejected = 0;
                leaveData.forEach(row => {
                    let specStatus = row[Object.keys(row)[11]] || "";
                    let mgrStatus = row[Object.keys(row)[14]] || "";
                    if (specStatus.includes("مرفوض") || mgrStatus.includes("مرفوض")) leaveRejected++;
                    else if (mgrStatus === "مقبول ومؤرشف") leaveApproved++;
                    else leavePending++;
                });

                document.getElementById('leavePending').innerText = leavePending;
                document.getElementById('leaveApproved').innerText = leaveApproved;
                document.getElementById('leaveRejected').innerText = leaveRejected;
                document.getElementById('leaveTotal').innerText = leaveData.length;

                // 2. معالجة بيانات التعاقدات والمشتريات
                let purPending = 0, purApproved = 0, purRejected = 0;
                purchaseData.forEach(row => {
                    let stage = row[Object.keys(row)[13]] || "";
                    if (stage.includes("مرفوض")) purRejected++;
                    else if (stage.includes("معتمد نهائياً")) purApproved++;
                    else purPending++;
                });

                document.getElementById('purPending').innerText = purPending;
                document.getElementById('purApproved').innerText = purApproved;
                document.getElementById('purRejected').innerText = purRejected;
                document.getElementById('purTotal').innerText = purchaseData.length;

            })
            .catch(err => {
                console.error("خطأ في جلب البيانات:", err);
                errorBox.innerText = "حدث خطأ أثناء تحديث البيانات، يرجى المحاولة مرة أخرى.";
                errorBox.style.display = 'block';
            })
            .finally(() => {
                // إعادة الزر لحالته الطبيعية
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
            });
        }
    </script>
</body>
</html>
