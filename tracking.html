<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة متابعة الإدارات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('./hig.png') no-repeat center center fixed; background-size: cover; color: #fff; min-height: 100vh; padding-bottom: 20px; }
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #020617 0%, #0f172a 100%); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px); padding: 50px 40px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; border: 1px solid rgba(197, 155, 39, 0.3); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
        .login-logo { width: 80px; height: 80px; border-radius: 50%; background: #fff; padding: 3px; border: 2px solid #c59b27; margin-bottom: 20px; box-shadow: 0 0 20px rgba(197, 155, 39, 0.4); }
        .login-box h2 { color: #fbbf24; margin-bottom: 8px; font-size: 26px; font-weight: 900; }
        .login-box p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #c59b27; font-size: 16px; pointer-events: none; }
        .login-box select, .login-box input { width: 100%; padding: 14px 15px 14px 45px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-family: 'Cairo'; font-size: 15px; outline: none; }
        .login-box button { width: 100%; padding: 15px; background: linear-gradient(135deg, #c59b27, #9f7a17); color: #fff; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; font-family: 'Cairo'; font-size: 18px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .login-box button:disabled { opacity: 0.7; cursor: not-allowed; }
        
        #dashboardScreen { display: none; }
        header { background: rgba(15, 23, 42, 0.95); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #c59b27; position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-area img { width: 35px; height: 35px; border-radius: 50%; background: #fff; padding: 2px; border: 1px solid #c59b27; }
        .logo-area h1 { font-size: 14px; color: #fbbf24; }
        .back-btn { text-decoration: none; padding: 6px 12px; border-radius: 6px; background: #c59b27; color: #0f172a; font-weight: 700; font-size: 11px; display: flex; align-items: center; gap: 5px; }
        
        .container { max-width: 1100px; margin: 15px auto; padding: 0 10px; }
        .welcome-msg { text-align: right; color: #4ade80; font-size: 16px; font-weight: 700; margin-bottom: 10px; padding-right: 5px; }
        .page-title { text-align: center; margin-bottom: 20px; color: #fbbf24; font-size: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .refresh-btn { background: #0d6efd; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-family: 'Cairo'; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .section-title { color: #cbd5e1; font-size: 15px; margin: 20px 0 10px 0; border-right: 4px solid #c59b27; padding-right: 8px; display: flex; align-items: center; gap: 6px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        @media (min-width: 768px) { .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; } }
        .stat-card { padding: 12px 8px; border-radius: 10px; text-align: center; color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.3); position: relative; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card h3 { font-size: 11px; margin-bottom: 5px; z-index: 2; position: relative; }
        .stat-card .number { font-size: 24px; font-weight: 900; z-index: 2; position: relative; }
        .stat-card i { position: absolute; left: -5px; bottom: -5px; font-size: 50px; opacity: 0.1; z-index: 1; }
        .card-yellow { background: linear-gradient(135deg, #d97706, #b45309); }
        .card-green { background: linear-gradient(135deg, #059669, #047857); }
        .card-red { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .card-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .error-msg { text-align: center; padding: 15px; color: #f87171; font-size: 14px; background: rgba(220,38,38,0.1); border-radius: 8px; margin-top: 15px; display: none; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: #1e293b; width: 100%; max-width: 1200px; border-radius: 12px; border: 1px solid #c59b27; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { background: #0f172a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .modal-header h3 { color: #fbbf24; font-size: 16px; }
        .close-modal { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .modal-body { padding: 15px; overflow-y: auto; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .filter-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; flex-grow: 1; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; position: relative; }
        .filter-group label { font-size: 12px; color: #fbbf24; font-weight: 700; }
        .filter-group input { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-family: 'Cairo'; font-size: 13px; outline: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .print-btn { background: #198754; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-family: 'Cairo'; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; height: fit-content; align-self: flex-end; }
        .suggestions-box { position: absolute; top: 100%; right: 0; left: 0; background: #1e293b; border: 1px solid #c59b27; border-radius: 6px; max-height: 150px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .suggestion-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #334155; color: #fff; }
        .suggestion-item:hover { background: #c59b27; color: #0f172a; font-weight: bold; }
        .details-table { width: 100%; border-collapse: collapse; text-align: right; font-size: 13px; }
        .details-table th, .details-table td { padding: 10px; border-bottom: 1px solid #334155; white-space: nowrap; color: #fff; }
        .details-table th { background: #0f172a; color: #fbbf24; }
        .hide-col { display: none !important; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; }
        .status-pending { background: rgba(217, 119, 6, 0.2); color: #fbbf24; border: 1px solid #d97706; }
        .status-approved { background: rgba(5, 150, 105, 0.2); color: #4ade80; border: 1px solid #059669; }
        .status-rejected { background: rgba(220, 38, 38, 0.2); color: #f87171; border: 1px solid #dc2626; }
        
        @media print {
            @page { size: A4 landscape; margin: 5mm; }
            body { background: #fff !important; color: #000 !important; }
            #dashboardScreen, #loginScreen, .filter-bar, .print-btn, .close-modal, header, .back-btn, .action-bar { display: none !important; }
            .modal { position: static; background: none; display: block !important; padding: 0; }
            .modal-content { border: none; box-shadow: none; max-height: none; overflow: visible; background: #fff !important; }
            .modal-header { background: none; border-bottom: 2px solid #000; display: block !important; }
            .modal-header h3 { color: #000 !important; text-align: center; }
            .details-table th, .details-table td { border: 1px solid #000; color: #000 !important; padding: 4px; text-align: center; }
            .details-table th { background: #e2e8f0 !important; }
            .hide-col { display: none !important; }
        }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <img src="./logo.png" alt="شعار" class="login-logo">
        <h2>بوابة المتابعة</h2>
        <p class="subtitle">الهيئة العامة للسد العالي وخزان أسوان</p>
        <div class="input-group">
            <i class="fas fa-user"></i>
            <select id="loginUsername"><option value="">-- جاري تحميل المستخدمين... --</option></select>
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
        </div>
        <button id="loginBtn" onclick="checkLogin()"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</button>
        <p id="loginError" style="color: #ef4444; font-size: 13px; margin-top: 15px; display: none; font-weight: bold;"></p>
    </div>
</div>

<div id="dashboardScreen">
    <header>
        <div class="logo-area">
            <img src="./logo.png" alt="شعار">
            <h1>لوحة المتابعة المركزية</h1>
        </div>
        <a href="index.html" class="back-btn"><i class="fas fa-home"></i> الرئيسية</a>
    </header>
    <div class="container">
        <div class="welcome-msg" id="welcomeMsg"></div>
        <div class="page-title">
            <span><i class="fas fa-chart-pie"></i> إحصائيات حركة العمل</span>
            <button class="refresh-btn" id="refreshBtn" onclick="loadStats()"><i class="fas fa-sync-alt"></i> تحديث</button>
        </div>
        <div id="errorBox" class="error-msg"></div>

        <h2 class="section-title"><i class="fas fa-shopping-cart"></i> إدارة التعاقدات والمشتريات</h2>
        <div class="stats-grid">
            <div class="stat-card card-yellow" onclick="openDetailsModal('purchase', 'pending')"><h3><i class="fas fa-clock"></i> معلقة</h3><div class="number" id="purPending">-</div></div>
            <div class="stat-card card-green" onclick="openDetailsModal('purchase', 'approved')"><h3><i class="fas fa-check-circle"></i> معتمدة</h3><div class="number" id="purApproved">-</div></div>
            <div class="stat-card card-red" onclick="openDetailsModal('purchase', 'rejected')"><h3><i class="fas fa-times-circle"></i> مرفوضة</h3><div class="number" id="purRejected">-</div></div>
            <div class="stat-card card-blue" onclick="openDetailsModal('purchase', 'total')"><h3><i class="fas fa-list"></i> الإجمالي</h3><div class="number" id="purTotal">-</div></div>
        </div>

        <h2 class="section-title"><i class="fas fa-calendar-alt"></i> إدارة الإجازات</h2>
        <div class="stats-grid">
            <div class="stat-card card-yellow" onclick="openDetailsModal('leave', 'pending')"><h3><i class="fas fa-clock"></i> معلقة</h3><div class="number" id="leavePending">-</div></div>
            <div class="stat-card card-green" onclick="openDetailsModal('leave', 'approved')"><h3><i class="fas fa-check-circle"></i> معتمدة</h3><div class="number" id="leaveApproved">-</div></div>
            <div class="stat-card card-red" onclick="openDetailsModal('leave', 'rejected')"><h3><i class="fas fa-times-circle"></i> مرفوضة</h3><div class="number" id="leaveRejected">-</div></div>
            <div class="stat-card card-blue" onclick="openDetailsModal('leave', 'total')"><h3><i class="fas fa-list"></i> الإجمالي</h3><div class="number" id="leaveTotal">-</div></div>
        </div>
    </div>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">تفاصيل الطلبات</h3>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="action-bar">
                <div class="filter-bar">
                    <div class="filter-group">
                        <label><i class="fas fa-user"></i> البحث بالاسم:</label>
                        <input type="text" id="filterName" placeholder="اكتب الاسم..." oninput="handleNameInput()" autocomplete="off">
                        <div id="nameSuggestions" class="suggestions-box"></div>
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-barcode"></i> السريال نمبر:</label>
                        <input type="text" id="filterSerial" placeholder="ابحث برقم السريال..." oninput="applyFilters()">
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-calendar-alt"></i> من تاريخ:</label>
                        <input type="date" id="filterDateFrom" onchange="applyFilters()">
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-calendar-check"></i> إلى تاريخ:</label>
                        <input type="date" id="filterDateTo" onchange="applyFilters()">
                    </div>
                </div>
                <button class="print-btn" onclick="window.print()"><i class="fas fa-file-pdf"></i> طباعة PDF</button>
            </div>
            <div id="modalTableContainer"></div>
        </div>
    </div>
</div>

<script>
    // ==================== ثوابت ====================
    const LEAVE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT1t4J0CU27xPKyNHRlsIYn1wDylkF6FM6rUG9TK7l8tXKW-upnje5ohCzWYIgMXHAeqRTjaDwI9EEe/pub?gid=0&single=true&output=csv";
    const PURCHASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxp-T7L4Q8VCHi5eLR4oY1FAq0vbDgJVKLphkUPeCMFeoYEeAQyCS7dUmd6STXFSK7LnTcDCk4NMTU/pub?gid=0&single=true&output=csv";
    const USERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7qyqwgacjwMEXUdYy_4GS2CYg74IzW2YYnLetmVhJyRjrC0M3AfRP5w6Uq0bYjuNuJjf9qj-B9QlN/pub?gid=667920095&single=true&output=csv";

    // ==================== متغيرات عامة ====================
    let currentUserName = "";
    let globalLeaveData = [];
    let globalPurchaseData = [];
    let currentActiveData = [];   // بيانات المودال بعد الفلترة حسب الحالة (ثابتة أثناء البحث)
    let currentType = "";
    let currentStatusFilter = "";

    // ==================== ترجمات الأعمدة ====================
    const columnTranslations = {
        "Timestamp": "وقت الإرسال", "Email Address": "البريد الإلكتروني",
        "Name": "اسم الموظف", "EmployeeName": "اسم الموظف", "Employee Name": "اسم الموظف",
        "Serial": "السريال نمبر", "Serial Number": "السريال نمبر",
        "ID": "رقم الطلب", "Date": "التاريخ",
        "StartDate": "تاريخ البداية", "EndDate": "تاريخ النهاية",
        "LeaveType": "نوع الإجازة", "Leave Type": "نوع الإجازة",
        "From Date": "من تاريخ", "To Date": "إلى تاريخ",
        "Reason": "السبب", "Status": "الحالة",
        "ManagerStatus": "حالة المدير", "Manager Status": "حالة المدير",
        "ManagerName": "اسم المدير", "Manager_Name": "اسم المدير",
        "SpecialistStatus": "حالة المختص",
        "Item": "الصنف المطلوب", "Items": "الأصناف",
        "Quantity": "الكمية", "Department": "الإدارة",
        "Parent_Department": "الإدارة", "Parent_Deportment": "الإدارة",
        "Stage": "مرحلة الطلب", "Current_Stage": "المرحلة الحالية",
        "Request_ID": "رقم الطلب", "Applicant_Name": "مقدم الطلب",
        "Role": "الوظيفة", "Manager_Title": "المسمى الوظيفي للمدير",
        "Items_list": "الأصناف", "Total_Cost": "التكلفة الإجمالية",
        "JobCategory": "الفئة الوظيفية", "NationalID": "الرقم القومي",
        "National_ID": "الرقم القومي", "Phone": "رقم الهاتف",
        "FiledInfo": "حالة الملف", "DaysCount": "عدد الأيام"
    };

    // ==================== دوال الحالة ====================
    function getLeaveStatus(row) {
        let s = (row["Status"] || "").trim().toLowerCase();
        if (s.includes("مرفوض") || s.includes("رفض")) return "rejected";
        if (s === "مقبول ومؤرشف" || s.includes("مقبول") || s.includes("معتمد")) return "approved";
        return "pending";
    }
    function getPurchaseStatus(row) {
        let s = (row["Current_Stage"] || row["Status"] || "").trim().toLowerCase();
        if (s.includes("مرفوض") || s.includes("رفض")) return "rejected";
        if (s.includes("معتمد نهائياً") || s.includes("معتمد") || s.includes("مقبول") || s.includes("مؤرشف")) return "approved";
        return "pending";
    }
    function getStatusForType(row) {
        return (currentType === 'leave') ? getLeaveStatus(row) : getPurchaseStatus(row);
    }

    // ==================== مساعدة: مفاتيح الأعمدة ====================
    function findNameKey(keys) {
        return keys.find(k => k.toLowerCase().includes('name') || k.includes('اسم')) || keys[2] || keys[1] || keys[0];
    }
    function findSerialKey(keys) {
        return keys.find(k => k.toLowerCase().includes('serial') || k.toLowerCase() === 'id' || k.toLowerCase().includes('request_id') || k.includes('سريال') || k.includes('رقم')) || keys[1] || keys[0];
    }
    function findDateKey(keys) {
        return keys.find(k => k.toLowerCase().includes('date') || k.toLowerCase().includes('time') || k.toLowerCase() === 'timestamp' || k.includes('تاريخ') || k.includes('وقت')) || keys[0];
    }

    // ==================== ترتيب حسب التاريخ (الأحدث أولاً) ====================
    function sortRequests(data) {
        if (data.length === 0) return data;
        let dateKey = findDateKey(Object.keys(data[0]));
        if (!dateKey) return data;
        return [...data].sort((a, b) => {
            let dA = new Date(a[dateKey]), dB = new Date(b[dateKey]);
            if (isNaN(dA) || isNaN(dB)) return String(b[dateKey] || '').localeCompare(String(a[dateKey] || ''));
            return dB - dA;
        });
    }

    // ==================== تحميل المستخدمين ====================
    window.onload = function () {
        Papa.parse(USERS_CSV_URL + "&t=" + new Date().getTime(), {
            download: true, header: true, skipEmptyLines: true,
            complete: function (results) {
                let select = document.getElementById('loginUsername');
                select.innerHTML = '<option value="">-- اختر اسم المستخدم --</option>';
                results.data.forEach(row => {
                    let user = row[Object.keys(row)[0]] || "";
                    if (user) {
                        let opt = document.createElement('option');
                        opt.value = user; opt.textContent = user;
                        select.appendChild(opt);
                    }
                });
            }
        });
    };

    // ==================== تسجيل الدخول ====================
    function checkLogin() {
        const user = document.getElementById('loginUsername').value;
        const pass = document.getElementById('loginPassword').value.trim();
        const errorMsg = document.getElementById('loginError');
        const btn = document.getElementById('loginBtn');

        if (!user || !pass) {
            errorMsg.innerText = "يرجى اختيار المستخدم وإدخال كلمة المرور";
            errorMsg.style.display = 'block';
            return;
        }
        errorMsg.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

        Papa.parse(USERS_CSV_URL + "&t=" + new Date().getTime(), {
            download: true, header: true, skipEmptyLines: true,
            complete: function (results) {
                let isValid = false;
                results.data.forEach(row => {
                    let dbUser = row[Object.keys(row)[0]] || "";
                    let dbPass = row[Object.keys(row)[1]] || "";
                    let dbName = row[Object.keys(row)[2]] || "";
                    if (dbUser.trim() === user && dbPass.trim() === pass) {
                        isValid = true;
                        currentUserName = dbName || user;
                    }
                });
                if (isValid) {
                    sessionStorage.setItem('app_access_token', 'granted');
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboardScreen').style.display = 'block';
                    document.getElementById('welcomeMsg').innerHTML = "أهلاً بك، " + currentUserName + " 👋";
                    loadStats();
                } else {
                    errorMsg.innerText = "بيانات الدخول غير صحيحة";
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                }
            }
        });
    }

    // ==================== تحميل الإحصائيات ====================
    function loadStats() {
        const btn = document.getElementById('refreshBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
        document.getElementById('errorBox').style.display = 'none';
        document.querySelectorAll('.number').forEach(el => el.innerText = '...');

        const ts = new Date().getTime();
        const fetchCSV = (url) => new Promise((resolve, reject) => {
            Papa.parse(url + "&t=" + ts, {
                download: true, header: true, skipEmptyLines: true,
                complete: (r) => resolve(r.data),
                error: (e) => reject(e)
            });
        });

        Promise.all([fetchCSV(LEAVE_CSV_URL), fetchCSV(PURCHASE_CSV_URL)])
            .then(([leaveData, purchaseData]) => {
                globalLeaveData = leaveData;
                globalPurchaseData = purchaseData;

                let lP = 0, lA = 0, lR = 0;
                leaveData.forEach(r => {
                    let s = getLeaveStatus(r);
                    if (s === 'rejected') lR++; else if (s === 'approved') lA++; else lP++;
                });
                document.getElementById('leavePending').innerText = lP;
                document.getElementById('leaveApproved').innerText = lA;
                document.getElementById('leaveRejected').innerText = lR;
                document.getElementById('leaveTotal').innerText = leaveData.length;

                let pP = 0, pA = 0, pR = 0;
                purchaseData.forEach(r => {
                    let s = getPurchaseStatus(r);
                    if (s === 'rejected') pR++; else if (s === 'approved') pA++; else pP++;
                });
                document.getElementById('purPending').innerText = pP;
                document.getElementById('purApproved').innerText = pA;
                document.getElementById('purRejected').innerText = pR;
                document.getElementById('purTotal').innerText = purchaseData.length;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('errorBox').innerText = "حدث خطأ أثناء تحديث البيانات.";
                document.getElementById('errorBox').style.display = 'block';
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
            });
    }

    // ==================== فتح المودال (مع فلترة صحيحة) ====================
    function openDetailsModal(type, status) {
        currentType = type;
        currentStatusFilter = status;

        // اختيار مصدر البيانات
        let allData = (type === 'leave') ? globalLeaveData : globalPurchaseData;

        // ✅ الفلترة حسب الحالة
        if (status === 'total') {
            currentActiveData = sortRequests([...allData]);
        } else {
            let filtered = allData.filter(row => {
                let s = (type === 'leave') ? getLeaveStatus(row) : getPurchaseStatus(row);
                return s === status;
            });
            currentActiveData = sortRequests(filtered);
        }

        // العنوان
        let titleText = "";
        if (type === 'leave') {
            titleText = status === 'pending' ? "طلبات الإجازات المعلقة" :
                        status === 'approved' ? "طلبات الإجازات المعتمدة" :
                        status === 'rejected' ? "طلبات الإجازات المرفوضة" :
                        "إجمالي طلبات الإجازات";
        } else {
            titleText = status === 'pending' ? "طلبات المشتريات المعلقة" :
                        status === 'approved' ? "طلبات المشتريات المعتمدة نهائياً" :
                        status === 'rejected' ? "طلبات المشتريات المرفوضة" :
                        "إجمالي طلبات المشتريات";
        }
        document.getElementById('modalTitle').innerText = titleText;

        // تصفير الفلاتر
        document.getElementById('filterName').value = '';
        document.getElementById('filterSerial').value = '';
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        document.getElementById('nameSuggestions').style.display = 'none';

        renderTable(currentActiveData);
        document.getElementById('detailsModal').style.display = 'flex';
    }

    // ==================== اقتراحات الأسماء ====================
    function handleNameInput() {
        let q = document.getElementById('filterName').value.trim().toLowerCase();
        let box = document.getElementById('nameSuggestions');

        if (currentActiveData.length === 0) {
            box.style.display = 'none';
            renderTable([]);
            return;
        }

        let nameKey = findNameKey(Object.keys(currentActiveData[0]));

        if (!q) {
            box.style.display = 'none';
            applyFilters();
            return;
        }

        let uniqueNames = [...new Set(
            currentActiveData.map(r => r[nameKey]).filter(n => n && String(n).toLowerCase().includes(q))
        )];

        if (uniqueNames.length > 0) {
            box.innerHTML = uniqueNames.map(n =>
                `<div class="suggestion-item" onclick="selectSuggestion(this.textContent)">${n}</div>`
            ).join('');
            box.style.display = 'block';
        } else {
            box.style.display = 'none';
        }

        applyFilters();
    }

    function selectSuggestion(name) {
        document.getElementById('filterName').value = name;
        document.getElementById('nameSuggestions').style.display = 'none';
        applyFilters();
    }

    // ==================== الفلترة (داخل currentActiveData فقط) ====================
    function applyFilters() {
        if (currentActiveData.length === 0) { renderTable([]); return; }

        let nameQ = document.getElementById('filterName').value.trim().toLowerCase();
        let serialQ = document.getElementById('filterSerial').value.trim().toLowerCase();
        let from = document.getElementById('filterDateFrom').value;
        let to = document.getElementById('filterDateTo').value;

        let keys = Object.keys(currentActiveData[0]);
        let nameKey = findNameKey(keys);
        let serialKey = findSerialKey(keys);
                let dateKey = findDateKey(keys);

        let filtered = currentActiveData.filter(row => {
            let nameVal = String(row[nameKey] || "").toLowerCase();
            let serialVal = String(row[serialKey] || "").toLowerCase();
            let dateVal = String(row[dateKey] || "").split(' ')[0];

            let matchName = !nameQ || nameVal.includes(nameQ);
            let matchSerial = !serialQ || serialVal.includes(serialQ);

            let matchDate = true;
            if (dateVal) {
                if (from && dateVal < from) matchDate = false;
                if (to && dateVal > to) matchDate = false;
            }

            return matchName && matchSerial && matchDate;
        });

        renderTable(filtered);
    }

    // ==================== عرض الجدول ====================
    function renderTable(data) {
        let container = document.getElementById('modalTableContainer');
        if (!data || data.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px; color: #94a3b8;">لا توجد طلبات مطابقة للبحث</p>';
            return;
        }

        let keys = Object.keys(data[0]);

        // الأعمدة المسموح بها لجدول المشتريات
        let purchaseAllowedCols = [
            "Request_ID", "Applicant_Name", "Role", "Parent_Department", "Total_Cost"
        ];

        // إظهار عمود "الحالة" فقط في كارت الإجمالي
        let showStatusColumn = (currentStatusFilter === 'total');

        let html = '<div style="overflow-x: auto;"><table class="details-table"><thead><tr>';
        html += '<th>م</th>';

        keys.forEach(key => {
            let cleanKey = key.trim().replace(/["']/g, '');
            let arabicHeader = columnTranslations[cleanKey] || cleanKey;
            let hideCol = false;

            if (currentType === 'purchase') {
                hideCol = !purchaseAllowedCols.includes(cleanKey);
            }

            let thClass = hideCol ? 'class="hide-col"' : '';
            html += `<th ${thClass}>${arabicHeader}</th>`;
        });

        if (showStatusColumn) {
            html += '<th>الحالة</th>';
        }

        html += '</tr></thead><tbody>';

        data.forEach((row, index) => {
            html += '<tr>';
            html += `<td>${index + 1}</td>`;

            keys.forEach(key => {
                let cleanKey = key.trim().replace(/["']/g, '');
                let hideCol = false;

                if (currentType === 'purchase') {
                    hideCol = !purchaseAllowedCols.includes(cleanKey);
                }

                let tdClass = hideCol ? 'class="hide-col"' : '';
                html += `<td ${tdClass}>${row[key] || '-'}</td>`;
            });

            if (showStatusColumn) {
                let st = getStatusForType(row);
                let label = st === 'approved' ? '<span class="status-badge status-approved">✅ معتمد</span>' :
                            st === 'rejected' ? '<span class="status-badge status-rejected">❌ مرفوض</span>' :
                            '<span class="status-badge status-pending">⏳ معلق</span>';
                html += `<td>${label}</td>`;
            }

            html += '</tr>';
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;
    }

    // ==================== إغلاق المودال ====================
    function closeModal() {
        document.getElementById('detailsModal').style.display = 'none';
    }

    // ==================== إغلاق المودال عند النقر خارجه ====================
    window.onclick = function (event) {
        let modal = document.getElementById('detailsModal');
        if (event.target === modal) {
            closeModal();
        }
        if (!event.target.closest('#filterName')) {
            let box = document.getElementById('nameSuggestions');
            if (box) box.style.display = 'none';
        }
    };
</script>
