<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة متابعة الإدارات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./logo.png">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('./hig.png') no-repeat center center fixed; background-size: cover; color: #fff; min-height: 100vh; padding-bottom: 20px; }
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #020617 0%, #0f172a 100%); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px); padding: 50px 40px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; border: 1px solid rgba(197, 155, 39, 0.3); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); position: relative; overflow: hidden; }
        .login-logo { width: 80px; height: 80px; border-radius: 50%; background: #fff; padding: 3px; border: 2px solid #c59b27; margin-bottom: 20px; box-shadow: 0 0 20px rgba(197, 155, 39, 0.4); }
        .login-box h2 { color: #fbbf24; margin-bottom: 8px; font-size: 26px; font-weight: 900; }
        .login-box p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #c59b27; font-size: 16px; pointer-events: none; }
        .login-box select, .login-box input { width: 100%; padding: 14px 15px 14px 45px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-family: 'Cairo'; font-size: 15px; outline: none; transition: 0.3s; }
        .login-box select:focus, .login-box input:focus { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,0.15); }
        .login-box button { width: 100%; padding: 15px; background: linear-gradient(135deg, #c59b27, #9f7a17); color: #fff; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; font-family: 'Cairo'; font-size: 18px; transition: 0.3s; box-shadow: 0 4px 15px rgba(197, 155, 39, 0.4); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .login-box button:hover { background: linear-gradient(135deg, #d4af37, #c59b27); transform: translateY(-2px); }
        .login-box button:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        #dashboardScreen { display: none; }
        header { background: rgba(15, 23, 42, 0.95); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #c59b27; position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-area img { width: 35px; height: 35px; border-radius: 50%; background: #fff; padding: 2px; border: 1px solid #c59b27; }
        .logo-area h1 { font-size: 14px; color: #fbbf24; margin: 0; font-weight: 900; }
        .back-btn { text-decoration: none; padding: 6px 12px; border-radius: 6px; background: #c59b27; color: #0f172a; font-weight: 700; font-size: 11px; display: flex; align-items: center; gap: 5px; transition: 0.2s; cursor: pointer;}
        .back-btn:hover { background: #eab308; }
        
        .container { max-width: 1100px; margin: 15px auto; padding: 0 10px; }
        .welcome-msg { text-align: right; color: #4ade80; font-size: 16px; font-weight: 700; margin-bottom: 10px; padding-right: 5px;}
        .page-title { text-align: center; margin-bottom: 20px; color: #fbbf24; font-size: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        
        .refresh-btn { background: #0d6efd; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-family: 'Cairo'; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .refresh-btn:hover { background: #0b5ed7; }
        .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .section-title { color: #cbd5e1; font-size: 15px; margin: 20px 0 10px 0; border-right: 4px solid #c59b27; padding-right: 8px; display: flex; align-items: center; gap: 6px; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        @media (min-width: 768px) { .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; } }
        
        .stat-card { padding: 12px 8px; border-radius: 10px; text-align: center; color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.3); position: relative; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .stat-card h3 { font-size: 11px; margin-bottom: 5px; opacity: 0.9; z-index: 2; position: relative; font-weight: 700;}
        .stat-card .number { font-size: 24px; font-weight: 900; z-index: 2; position: relative; color: #ffffff !important; }
        .stat-card i { position: absolute; left: -5px; bottom: -5px; font-size: 50px; opacity: 0.1; z-index: 1; }
        
        .card-yellow { background: linear-gradient(135deg, #d97706, #b45309); }
        .card-green { background: linear-gradient(135deg, #059669, #047857); }
        .card-red { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .card-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }

        .error-msg { text-align: center; padding: 15px; color: #f87171; font-size: 14px; background: rgba(220,38,38,0.1); border-radius: 8px; margin-top: 15px; display: none;}

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: #1e293b; width: 100%; max-width: 1200px; border-radius: 12px; border: 1px solid #c59b27; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { background: #0f172a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .modal-header h3 { color: #fbbf24; font-size: 16px; }
        .close-modal { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .modal-body { padding: 15px; overflow-y: auto; }
        
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .filter-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; flex-grow: 1; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; position: relative; }
        .filter-group label { font-size: 12px; color: #fbbf24; font-weight: 700; }
        .filter-group input { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-family: 'Cairo'; font-size: 13px; outline: none; }
        .filter-group input:focus { border-color: #fbbf24; }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            opacity: 0.8;
        }

        .print-btn { background: #198754; color: #ffffff !important; border: none; padding: 10px 18px; border-radius: 8px; font-family: 'Cairo'; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; height: fit-content; align-self: flex-end; }
        .print-btn i { color: #ffffff !important; font-size: 16px; }
        .print-btn:hover { background: #157347; }

        .suggestions-box { position: absolute; top: 100%; right: 0; left: 0; background: #1e293b; border: 1px solid #c59b27; border-radius: 6px; max-height: 150px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .suggestion-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #334155; transition: background 0.2s; color: #fff; }
        .suggestion-item:hover { background: #c59b27; color: #0f172a; font-weight: bold; }

        .details-table { width: 100%; border-collapse: collapse; text-align: right; font-size: 13px; }
        .details-table th, .details-table td { padding: 10px; border-bottom: 1px solid #334155; white-space: nowrap; color: #fff; }
        .details-table th { background: #0f172a; color: #fbbf24; }
        .details-table tr:hover { background: rgba(255,255,255,0.02); }
        
        .hide-col { display: none !important; }
        .col-items { display: none !important; }

        @media print {
            @page { size: A4 landscape; margin: 5mm; }
            body { background: #fff !important; color: #000 !important; }
            #dashboardScreen, #loginScreen, .filter-bar, .print-btn, .close-modal, .modal-header button, header, .back-btn, .action-bar { display: none !important; }
            .modal { position: static; background: none; display: block !important; padding: 0; margin: 0; }
            .modal-content { border: none; box-shadow: none; width: 100%; max-width: 100%; background: #fff !important; color: #000 !important; max-height: none; overflow: visible; }
            .modal-header { background: none; border-bottom: 2px solid #000; padding: 5px 0; display: block !important; }
            .modal-header h3 { color: #000 !important; font-size: 18px; text-align: center; margin-bottom: 10px; }
            .modal-body { padding: 0; overflow: visible; }
            
            .details-table { font-size: 10px; table-layout: auto; width: 100%; page-break-inside: auto; }
            .details-table th, .details-table td { border: 1px solid #000; white-space: normal; word-wrap: break-word; color: #000 !important; padding: 4px; text-align: center; }
            .details-table th { background: #e2e8f0 !important; color: #000 !important; }
            
            .hide-col { display: none !important; }
            .col-items { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <img src="./logo.png" alt="شعار الهيئة" class="login-logo">
            <h2>بوابة المتابعة</h2>
            <p class="subtitle">الهيئة العامة للسد العالي وخزان أسوان</p>
            
            <div class="input-group">
                <i class="fas fa-user"></i>
                <select id="loginUsername">
                    <option value="">-- جاري تحميل المستخدمين... --</option>
                </select>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="كلمة المرور">
            </div>
            
            <button id="loginBtn" onclick="checkLogin()">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
            </button>
            
            <p id="loginError" style="color: #ef4444; font-size: 13px; margin-top: 15px; display: none; font-weight: bold;"></p>
        </div>
    </div>

    <div id="dashboardScreen">
        <header>
            <div class="logo-area">
                <img src="./logo.png" alt="شعار">
                <h1>لوحة المتابعة المركزية</h1>
            </div>
            <a href="index.html" class="back-btn"><i class="fas fa-home"></i> الرئيسية</a>
        </header>

        <div class="container">
            <div class="welcome-msg" id="welcomeMsg"></div>
            
            <div class="page-title">
                <span><i class="fas fa-chart-pie"></i> إحصائيات حركة العمل</span>
                <button class="refresh-btn" id="refreshBtn" onclick="loadStats()"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>

            <div id="errorBox" class="error-msg"></div>

            <h2 class="section-title"><i class="fas fa-shopping-cart"></i> إدارة التعاقدات والمشتريات</h2>
            <div class="stats-grid">
                <div class="stat-card card-yellow" onclick="openDetailsModal('purchase', 'pending')"><h3><i class="fas fa-clock"></i> معلقة</h3><div class="number" id="purPending">-</div></div>
                <div class="stat-card card-green" onclick="openDetailsModal('purchase', 'approved')"><h3><i class="fas fa-check-circle"></i> معتمدة</h3><div class="number" id="purApproved">-</div></div>
                <div class="stat-card card-red" onclick="openDetailsModal('purchase', 'rejected')"><h3><i class="fas fa-times-circle"></i> مرفوضة</h3><div class="number" id="purRejected">-</div></div>
                <div class="stat-card card-blue" onclick="openDetailsModal('purchase', 'total')"><h3><i class="fas fa-list"></i> الإجمالي</h3><div class="number" id="purTotal">-</div></div>
            </div>

            <h2 class="section-title"><i class="fas fa-calendar-alt"></i> إدارة الإجازات</h2>
            <div class="stats-grid">
                <div class="stat-card card-yellow" onclick="openDetailsModal('leave', 'pending')"><h3><i class="fas fa-clock"></i> معلقة</h3><div class="number" id="leavePending">-</div></div>
                <div class="stat-card card-green" onclick="openDetailsModal('leave', 'approved')"><h3><i class="fas fa-check-circle"></i> معتمدة</h3><div class="number" id="leaveApproved">-</div></div>
                <div class="stat-card card-red" onclick="openDetailsModal('leave', 'rejected')"><h3><i class="fas fa-times-circle"></i> مرفوضة</h3><div class="number" id="leaveRejected">-</div></div>
                <div class="stat-card card-blue" onclick="openDetailsModal('leave', 'total')"><h3><i class="fas fa-list"></i> الإجمالي</h3><div class="number" id="leaveTotal">-</div></div>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">تفاصيل الطلبات</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="action-bar">
                    <div class="filter-bar">
                        <div class="filter-group" style="position: relative;">
                            <label><i class="fas fa-user"></i> البحث بالاسم:</label>
                            <input type="text" id="filterName" placeholder="اكتب الاسم..." oninput="handleNameInput()">
                            <div id="nameSuggestions" class="suggestions-box"></div>
                        </div>
                        <div class="filter-group">
                            <label><i class="fas fa-barcode"></i> السريال نمبر:</label>
                            <input type="text" id="filterSerial" placeholder="ابحث برقم السريال..." oninput="applyFilters()">
                        </div>
                        <div class="filter-group">
                            <label><i class="fas fa-calendar-alt"></i> من تاريخ:</label>
                            <input type="date" id="filterDateFrom" onchange="applyFilters()">
                        </div>
                        <div class="filter-group">
                            <label><i class="fas fa-calendar-check"></i> إلى تاريخ:</label>
                            <input type="date" id="filterDateTo" onchange="applyFilters()">
                        </div>
                    </div>
                    <button class="print-btn" onclick="window.print()"><i class="fas fa-file-pdf"></i> طباعة PDF</button>
                </div>

                <div id="modalTableContainer"></div>
            </div>
        </div>
    </div>
    
    <script>
        if (sessionStorage.getItem('app_access_token') !== 'granted') {
            window.location.replace("index.html");
        }

        // ✅ Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAOp-FyI7gDM-8Dn7GAL9BXSbiuqbrLvzg",
            authDomain: "dam-purchases-app.firebaseapp.com",
            projectId: "dam-purchases-app",
            storageBucket: "dam-purchases-app.appspot.com",
            messagingSenderId: "123271128649",
            appId: "1:123271128649:web:1096b95fc97c8575b50198"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUserName = "";
        let globalLeaveData = [];
        let globalPurchaseData = [];
        let currentActiveData = [];
        let currentType = "";
        let currentStatusFilter = "";

        const columnTranslations = {
            "Timestamp": "وقت الإرسال",
            "name": "اسم الموظف",
            "applicantName": "مقدم الطلب",
            "role": "الوظيفة",
            "parentDepartment": "الإدارة",
            "department": "الإدارة",
            "requestId": "رقم الطلب",
            "Request_ID": "رقم الطلب",
            "date": "التاريخ",
            "startDate": "تاريخ البداية",
            "endDate": "تاريخ النهاية",
            "leaveType": "نوع الإجازة",
            "reason": "السبب",
            "status": "الحالة",
            "Status": "الحالة",
            "Current_Stage": "المرحلة الحالية",
            "itemsList": "الأصناف",
            "totalCost": "التكلفة الإجمالية",
            "nationalId": "الرقم القومي",
            "phone": "رقم الهاتف",
            "managerName": "اسم المدير"
        };

        function getPurchaseStatus(row) {
            let stageVal = (row["Current_Stage"] || row["Status"] || "").toString().trim().toLowerCase();
            if (stageVal.includes("مرفوض") || stageVal.includes("رفض")) {
                return "rejected";
            }
            if (stageVal.includes("معتمد") || stageVal.includes("مقبول") || stageVal.includes("مؤرشف")) {
                return "approved";
            }
            return "pending";
        }

        function getLeaveStatus(row) {
            let statusVal = (row["status"] || row["Status"] || "").toString().trim().toLowerCase();
            if (statusVal.includes("مرفوض") || statusVal.includes("رفض")) return "rejected";
            if (statusVal.includes("مقبول") || statusVal.includes("معتمد")) return "approved";
            return "pending";
        }

        // ✅ تحميل قائمة المستخدمين المفلترة من Firestore
        window.onload = function() {
            const allowedRoles = ["مدير عام المكتب الفنى", "رئيس مجلس الإدارة"];
            let usersSet = new Set();

            db.collection("users").get().then((querySnapshot) => {
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    let centralVal = String(data.centralManager || "").trim();
                    let userName = String(data.name || "").trim();

                    if (allowedRoles.includes(centralVal) && userName !== "") {
                        usersSet.add(userName);
                    }
                });

                let select = document.getElementById('loginUsername');
                select.innerHTML = '<option value="">-- اختر اسم المستخدم --</option>';
                
                let usersList = [...usersSet].sort();
                usersList.forEach(name => {
                    let opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    select.appendChild(opt);
                });

                if (usersList.length === 0) {
                    let opt = document.createElement('option');
                    opt.value = "";
                    opt.textContent = "لا يوجد مستخدمين مطابقين";
                    select.appendChild(opt);
                }
            }).catch(err => {
                console.error("خطأ في تحميل المستخدمين:", err);
            });
        };

        function checkLogin() {
            const user = document.getElementById('loginUsername').value;
            const pass = document.getElementById('loginPassword').value.trim();
            const errorMsg = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!user || !pass) {
                errorMsg.innerText = "يرجى اختيار المستخدم وإدخال كلمة المرور";
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

            db.collection("users").where("name", "==", user).get().then((querySnapshot) => {
                if (querySnapshot.empty) {
                    errorMsg.innerText = "المستخدم غير موجود في قاعدة البيانات";
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                    return;
                }

                let userData = querySnapshot.docs[0].data();
                let storedPassword = String(userData.password || "").trim();

                if (storedPassword === pass) {
                    currentUserName = userData.name || user;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboardScreen').style.display = 'block';
                    document.getElementById('welcomeMsg').innerHTML = "أهلاً بك، " + currentUserName + " 👋";
                    loadStats();
                } else {
                    errorMsg.innerText = "كلمة المرور غير صحيحة";
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                }
            }).catch(err => {
                errorMsg.innerText = "خطأ في الاتصال بقاعدة البيانات";
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            });
        }
                function loadStats() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
            
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';
            document.querySelectorAll('.number').forEach(el => el.innerText = '...');

            db.collection("requests").get().then((querySnapshot) => {
                globalPurchaseData = [];
                querySnapshot.forEach((doc) => {
                    let req = doc.data();
                    req.Request_ID = doc.id;
                    globalPurchaseData.push(req);
                });

                globalLeaveData = [];

                let pPending = 0, pApproved = 0, pRejected = 0;
                globalPurchaseData.forEach(row => {
                    let st = getPurchaseStatus(row);
                    if (st === 'rejected') pRejected++;
                    else if (st === 'approved') pApproved++;
                    else pPending++;
                });

                document.getElementById('purPending').innerText = pPending;
                document.getElementById('purApproved').innerText = pApproved;
                document.getElementById('purRejected').innerText = pRejected;
                document.getElementById('purTotal').innerText = globalPurchaseData.length;

                document.getElementById('leavePending').innerText = 0;
                document.getElementById('leaveApproved').innerText = 0;
                document.getElementById('leaveRejected').innerText = 0;
                document.getElementById('leaveTotal').innerText = 0;

            }).catch(err => {
                console.error(err);
                errorBox.innerText = "حدث خطأ أثناء تحديث البيانات.";
                errorBox.style.display = 'block';
            }).finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
            });
        }

        function openDetailsModal(type, status) {
            currentType = type;
            currentStatusFilter = status;
            let data = (type === 'leave') ? globalLeaveData : globalPurchaseData;
            let titleText = "";

            if (type === 'leave') {
                if (status === 'pending') { titleText = "طلبات الإجازات المعلقة"; currentActiveData = data.filter(row => getLeaveStatus(row) === 'pending'); }
                else if (status === 'approved') { titleText = "طلبات الإجازات المعتمدة"; currentActiveData = data.filter(row => getLeaveStatus(row) === 'approved'); }
                else if (status === 'rejected') { titleText = "طلبات الإجازات المرفوضة"; currentActiveData = data.filter(row => getLeaveStatus(row) === 'rejected'); }
                else { titleText = "إجمالي طلبات الإجازات"; currentActiveData = data; }
            } else {
                if (status === 'pending') { titleText = "طلبات المشتريات المعلقة"; currentActiveData = data.filter(row => getPurchaseStatus(row) === 'pending'); }
                else if (status === 'approved') { titleText = "طلبات المشتريات المعتمدة نهائياً"; currentActiveData = data.filter(row => getPurchaseStatus(row) === 'approved'); }
                else if (status === 'rejected') { titleText = "طلبات المشتريات المرفوضة"; currentActiveData = data.filter(row => getPurchaseStatus(row) === 'rejected'); }
                else { titleText = "إجمالي طلبات المشتريات"; currentActiveData = data; }
            }

            document.getElementById('modalTitle').innerText = titleText;
            document.getElementById('filterName').value = '';
            document.getElementById('filterSerial').value = '';
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            document.getElementById('nameSuggestions').style.display = 'none';

            renderTable(currentActiveData);
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function handleNameInput() {
            let query = document.getElementById('filterName').value.trim().toLowerCase();
            let suggestionsBox = document.getElementById('nameSuggestions');
            
            if (currentActiveData.length === 0) return;
            let nameKey = "applicantName";
            
            if (!query) {
                suggestionsBox.style.display = 'none';
                applyFilters();
                return;
            }

            let uniqueNames = [...new Set(currentActiveData.map(row => row[nameKey] || row["name"]))].filter(name => name && name.toLowerCase().includes(query));

            if (uniqueNames.length > 0) {
                let html = '';
                uniqueNames.forEach(n => {
                    html += `<div class="suggestion-item" onclick="selectSuggestion('${n}')">${n}</div>`;
                });
                suggestionsBox.innerHTML = html;
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
            applyFilters();
        }

        function selectSuggestion(name) {
            document.getElementById('filterName').value = name;
            document.getElementById('nameSuggestions').style.display = 'none';
            applyFilters();
        }

        function applyFilters() {
            let nameQuery = document.getElementById('filterName').value.trim().toLowerCase();
            let serialQuery = document.getElementById('filterSerial').value.trim().toLowerCase();
            let dateFrom = document.getElementById('filterDateFrom').value;
            let dateTo = document.getElementById('filterDateTo').value;

            let baseData = (currentType === 'leave') ? globalLeaveData : globalPurchaseData;
            let filteredBase = baseData;

            if (currentStatusFilter !== 'total') {
                filteredBase = baseData.filter(row => {
                    let st = (currentType === 'leave') ? getLeaveStatus(row) : getPurchaseStatus(row);
                    return st === currentStatusFilter;
                });
            }

            let filtered = filteredBase.filter(row => {
                let nameVal = (row["applicantName"] || row["name"] || "").toLowerCase();
                let serialVal = (row["Request_ID"] || row["requestId"] || "").toLowerCase();
                let dateVal = (row["Timestamp"] || "").split('T')[0];

                let matchName = !nameQuery || nameVal.includes(nameQuery);
                let matchSerial = !serialQuery || serialVal.includes(serialQuery);
                
                let matchDate = true;
                if (dateVal) {
                    if (dateFrom && dateVal < dateFrom) matchDate = false;
                    if (dateTo && dateVal > dateTo) matchDate = false;
                }
                return matchName && matchSerial && matchDate;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            let container = document.getElementById('modalTableContainer');
            if (data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding: 20px; color: #94a3b8;">لا توجد طلبات مطابقة للبحث</p>';
                return;
            }

            let purchaseAllowedCols = [
                "Request_ID", "applicantName", "role", "parentDepartment", 
                "totalCost", "Current_Stage", "managerName"
            ];

            let displayCols = [];
            if (currentType === 'purchase') {
                displayCols = purchaseAllowedCols;
            } else {
                displayCols = ["Request_ID", "name", "date", "status"];
            }

            let html = '<div style="overflow-x: auto;"><table class="details-table"><thead><tr>';
            html += '<th>م</th>';

            displayCols.forEach(key => {
                let arabicHeader = columnTranslations[key] || key;
                html += `<th>${arabicHeader}</th>`;
            });
            html += '</tr></thead><tbody>';

            data.forEach((row, index) => {
                html += `<tr>`; 
                html += `<td>${index + 1}</td>`;
                
                displayCols.forEach(key => {
                    let val = row[key];
                    if (key === "Timestamp" && val) val = new Date(val).toLocaleDateString('ar-EG');
                    if (key === "itemsList" && val) {
                        try {
                            let items = JSON.parse(val);
                            val = items.map(it => it.item).join(', ');
                        } catch(e) {}
                    }
                    html += `<td>${val || '-'}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        window.onclick = function(event) {
            let modal = document.getElementById('detailsModal');
            if (event.target == modal) {
                closeModal();
            }
            if (!event.target.closest('#filterName')) {
                let box = document.getElementById('nameSuggestions');
                if(box) box.style.display = 'none';
            }
        }
    </script>
</body>
</html>
