<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة متابعة الإدارات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./logo.png">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('./hig.png') no-repeat center center fixed; background-size: cover; color: #fff; min-height: 100vh; padding-bottom: 20px; }
        
        /* === تنسيقات شاشة الدخول === */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #020617 0%, #0f172a 100%); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px); padding: 40px 30px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; border: 1px solid rgba(197, 155, 39, 0.3); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
        .login-logo { width: 80px; height: 80px; border-radius: 50%; background: #fff; padding: 3px; border: 2px solid #c59b27; margin-bottom: 20px; box-shadow: 0 0 20px rgba(197, 155, 39, 0.4); }
        .login-box h2 { color: #fbbf24; margin-bottom: 8px; font-size: 26px; font-weight: 900; }
        .login-box p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 14px 15px 14px 45px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-family: 'Cairo'; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,0.15); }
        .input-group i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #c59b27; font-size: 16px; pointer-events: none; }
        
        /* === القائمة المنسدلة المخصصة === */
        .custom-select-wrap { position: relative; width: 100%; user-select: none; margin-bottom: 20px; }
        .custom-select-trigger { width: 100%; padding: 14px 15px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 15px; font-family: 'Cairo', sans-serif; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; transition: all 0.25s ease; text-align: right; direction: rtl; }
        .custom-select-trigger:hover { border-color: #c59b27; }
        .custom-select-trigger.open { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,0.2); }
        .custom-select-trigger.placeholder { color: #64748b; font-weight: 500; }
        .custom-select-trigger .select-arrow { font-size: 12px; color: #fbbf24; transition: transform 0.25s ease; }
        .custom-select-trigger.open .select-arrow { transform: rotate(180deg); }
        .custom-select-menu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #1e293b; border: 1px solid #c59b27; border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,0.6); z-index: 2000; max-height: 260px; overflow-y: auto; padding: 6px; opacity: 0; transform: translateY(-8px) scale(0.98); visibility: hidden; transition: all 0.22s ease; direction: rtl; }
        .custom-select-menu.open { opacity: 1; transform: translateY(0) scale(1); visibility: visible; }
        .custom-select-option { padding: 12px 14px; border-radius: 6px; color: #cbd5e1; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.18s ease; margin-bottom: 2px; text-align: right; }
        .custom-select-option:hover { background: rgba(197,155,39,0.18); color: #fbbf24; padding-right: 18px; }
        .custom-select-option.selected { background: rgba(251,191,36,0.15); color: #fbbf24; font-weight: 700; }

        .login-box button { width: 100%; padding: 15px; background: linear-gradient(135deg, #c59b27, #9f7a17); color: #fff; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; font-family: 'Cairo'; font-size: 18px; transition: 0.3s; box-shadow: 0 4px 15px rgba(197, 155, 39, 0.4); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .login-box button:hover { background: linear-gradient(135deg, #d4af37, #c59b27); transform: translateY(-2px); }
        .login-box button:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* === تنسيقات لوحة المتابعة === */
        #dashboardScreen { display: none; }
        header { background: rgba(15, 23, 42, 0.95); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #c59b27; position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-area img { width: 35px; height: 35px; border-radius: 50%; background: #fff; padding: 2px; border: 1px solid #c59b27; }
        .logo-area h1 { font-size: 14px; color: #fbbf24; margin: 0; font-weight: 900; }
        .back-btn { text-decoration: none; padding: 6px 12px; border-radius: 6px; background: #c59b27; color: #0f172a; font-weight: 700; font-size: 11px; display: flex; align-items: center; gap: 5px; transition: 0.2s; cursor: pointer;}
        .back-btn:hover { background: #eab308; }
        
        .container { max-width: 1100px; margin: 15px auto; padding: 0 10px; }
        .welcome-msg { text-align: right; color: #4ade80; font-size: 15px; font-weight: 700; margin-bottom: 10px; padding-right: 5px;}
        .page-title { text-align: center; margin-bottom: 20px; color: #fbbf24; font-size: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        
        .refresh-btn { background: #0d6efd; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-family: 'Cairo'; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .refresh-btn:hover { background: #0b5ed7; }

        .section-title { color: #cbd5e1; font-size: 15px; margin: 20px 0 10px 0; border-right: 4px solid #c59b27; padding-right: 8px; display: flex; align-items: center; gap: 6px; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        @media (min-width: 768px) { .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; } }
        
        .stat-card { padding: 15px 10px; border-radius: 12px; text-align: center; color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.3); position: relative; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card h3 { font-size: 12px; margin-bottom: 5px; opacity: 0.9; z-index: 2; position: relative; font-weight: 700;}
        .stat-card .number { font-size: 26px; font-weight: 900; z-index: 2; position: relative; color: #ffffff !important; }
        .stat-card i { position: absolute; left: -5px; bottom: -5px; font-size: 50px; opacity: 0.1; z-index: 1; }
        
        .card-yellow { background: linear-gradient(135deg, #d97706, #b45309); }
        .card-green { background: linear-gradient(135deg, #059669, #047857); }
        .card-red { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .card-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }

        /* === تنسيقات المودال والجدول الجديد === */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 10px; }
        .modal-content { background: #0f172a; width: 100%; max-width: 900px; border-radius: 12px; border: 1px solid #334155; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .modal-header h3 { color: #fbbf24; font-size: 16px; }
        .close-modal { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .modal-body { padding: 15px; overflow-y: auto; }
        
        .action-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .filter-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: #1e293b; padding: 12px; border-radius: 8px; }
        @media (max-width: 500px) { .filter-bar { grid-template-columns: 1fr; } }
        .filter-group { display: flex; flex-direction: column; gap: 5px; position: relative; }
        .filter-group label { font-size: 11px; color: #94a3b8; font-weight: 700; }
        .filter-group input { padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-family: 'Cairo'; font-size: 12px; outline: none; }
        .filter-group input:focus { border-color: #fbbf24; }
        
        .print-btn { background: #198754; color: #fff; border: none; padding: 10px; border-radius: 8px; font-family: 'Cairo'; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }

        /* === تحويل الجدول لكروت للعرض على الموبايل === */
        .data-cards { display: flex; flex-direction: column; gap: 10px; }
        .data-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; position: relative; }
        .data-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #475569; padding-bottom: 10px; margin-bottom: 10px; }
        .data-card-title { color: #fbbf24; font-weight: 700; font-size: 14px; }
        .data-card-badge { background: rgba(59,130,246,0.2); color: #60a5fa; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        
        .data-card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .data-item { display: flex; flex-direction: column; gap: 2px; }
        .data-item .lbl { color: #94a3b8; font-size: 11px; font-weight: 600; }
        .data-item .val { color: #e2e8f0; font-size: 13px; font-weight: 700; }
        
        .status-pending { color: #fbbf24; font-weight: 700; }
        .status-approved { color: #4ade80; font-weight: 700; }
        .status-rejected { color: #f87171; font-weight: 700; }

        @media print {
            @page { size: A4 portrait; margin: 5mm; }
            body { background: #fff !important; color: #000 !important; }
            #dashboardScreen, #loginScreen, .filter-bar, .print-btn, .close-modal, .modal-header button, header, .back-btn, .action-bar { display: none !important; }
            .modal { position: static; background: none; display: block !important; padding: 0; margin: 0; }
            .modal-content { border: none; box-shadow: none; width: 100%; max-width: 100%; background: #fff !important; color: #000 !important; max-height: none; overflow: visible; }
            .modal-header { background: none; border-bottom: 2px solid #000; padding: 5px 0; display: block !important; }
            .modal-header h3 { color: #000 !important; font-size: 18px; text-align: center; margin-bottom: 10px; }
            .modal-body { padding: 0; overflow: visible; }
            
            .data-cards { gap: 5px; }
            .data-card { border: 1px solid #000; page-break-inside: avoid; background: #fff; color: #000; }
            .data-card-title { color: #000; }
            .data-item .lbl { color: #555; }
            .data-item .val { color: #000; }
        }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <img src="./logo.png" alt="شعار الهيئة" class="login-logo">
            <h2>بوابة المتابعة</h2>
            <p class="subtitle">الهيئة العامة للسد العالي وخزان أسوان</p>
            
            <div class="custom-select-wrap" id="loginRoleWrap" data-placeholder="-- اختر المسمى الوظيفي --">
                <div class="custom-select-trigger placeholder" id="loginRoleTrigger" tabindex="0">
                    <span class="custom-select-label">-- جاري تحميل المسميات... --</span>
                    <i class="fas fa-chevron-down select-arrow"></i>
                </div>
                <div class="custom-select-menu" id="loginRoleMenu"></div>
                <input type="hidden" id="loginRoleSelected" value="">
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="كلمة المرور">
            </div>
            
            <button id="loginBtn" onclick="checkLogin()">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
            </button>
            
            <p id="loginError" style="color: #ef4444; font-size: 13px; margin-top: 15px; display: none; font-weight: bold;"></p>
        </div>
    </div>

    <div id="dashboardScreen">
        <header>
            <div class="logo-area">
                <img src="./logo.png" alt="شعار">
                <h1>لوحة المتابعة المركزية</h1>
            </div>
            <a href="index.html" class="back-btn"><i class="fas fa-home"></i> الرئيسية</a>
        </header>

        <div class="container">
            <div class="welcome-msg" id="welcomeMsg"></div>
            
            <div class="page-title">
                <span><i class="fas fa-chart-pie"></i> إحصائيات حركة العمل</span>
                <button class="refresh-btn" id="refreshBtn" onclick="loadStats()"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>

            <h2 class="section-title"><i class="fas fa-shopping-cart"></i> إدارة التعاقدات والمشتريات</h2>
            <div class="stats-grid">
                <div class="stat-card card-yellow" onclick="openDetailsModal('purchase', 'pending')"><h3><i class="fas fa-clock"></i> معلقة</h3><div class="number" id="purPending">-</div></div>
                <div class="stat-card card-green" onclick="openDetailsModal('purchase', 'approved')"><h3><i class="fas fa-check-circle"></i> معتمدة</h3><div class="number" id="purApproved">-</div></div>
                <div class="stat-card card-red" onclick="openDetailsModal('purchase', 'rejected')"><h3><i class="fas fa-times-circle"></i> مرفوضة</h3><div class="number" id="purRejected">-</div></div>
                <div class="stat-card card-blue" onclick="openDetailsModal('purchase', 'total')"><h3><i class="fas fa-list"></i> الإجمالي</h3><div class="number" id="purTotal">-</div></div>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">تفاصيل الطلبات</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="action-bar">
                    <div class="filter-bar">
                        <div class="filter-group">
                            <label>بحث بالاسم:</label>
                            <input type="text" id="filterName" placeholder="اسم الموظف..." oninput="applyFilters()">
                        </div>
                        <div class="filter-group">
                            <label>رقم الطلب:</label>
                            <input type="text" id="filterSerial" placeholder="REQ-..." oninput="applyFilters()">
                        </div>
                    </div>
                    <button class="print-btn" onclick="window.print()"><i class="fas fa-file-pdf"></i> طباعة PDF</button>
                </div>

                <div id="modalTableContainer" class="data-cards"></div>
            </div>
        </div>
    </div>
        <script>
        if (sessionStorage.getItem('app_access_token') !== 'granted') {
            window.location.replace("index.html");
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAOp-FyI7gDM-8Dn7GAL9BXSbiuqbrLvzg",
            authDomain: "dam-purchases-app.firebaseapp.com",
            projectId: "dam-purchases-app",
            storageBucket: "dam-purchases-app.appspot.com",
            messagingSenderId: "123271128649",
            appId: "1:123271128649:web:1096b95fc97c8575b50198"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUserName = "";
        let currentUserRole = "";
        let globalPurchaseData = [];
        let currentActiveData = [];
        let currentType = "";
        let currentStatusFilter = "";

        // === Custom Select Class ===
        class CustomSelect {
            constructor(wrapId, options = [], defaultValue = "") {
                this.wrap = document.getElementById(wrapId);
                this.trigger = this.wrap.querySelector('.custom-select-trigger');
                this.menu = this.wrap.querySelector('.custom-select-menu');
                this.labelEl = this.trigger.querySelector('.custom-select-label');
                this.hiddenInput = this.wrap.querySelector('input[type="hidden"]');
                this.placeholder = this.wrap.dataset.placeholder || "اختر...";
                this.options = options;
                this._render();
                this._bind();
                if (defaultValue) this.setValue(defaultValue, false);
                else this._applyPlaceholder();
            }
            _bind() {
                this.trigger.addEventListener('click', (e) => { e.stopPropagation(); this.toggle(); });
                document.addEventListener('click', (e) => { if (!this.wrap.contains(e.target)) this.close(); });
            }
            setOptions(opts) {
                this.options = opts;
                this._render();
            }
            _render() {
                this.menu.innerHTML = "";
                if (this.options.length === 0) {
                    this.menu.innerHTML = '<div style="padding:14px;text-align:center;color:#64748b;font-size:12px;">لا توجد خيارات</div>';
                    return;
                }
                this.options.forEach((opt) => {
                    const div = document.createElement('div');
                    div.className = 'custom-select-option';
                    div.textContent = opt;
                    div.dataset.value = opt;
                    if (this.hiddenInput.value === opt) div.classList.add('selected');
                    div.addEventListener('click', (e) => { e.stopPropagation(); this.setValue(opt); this.close(); });
                    this.menu.appendChild(div);
                });
            }
            setValue(value, fireEvents = true) {
                this.hiddenInput.value = value;
                if (value) { this.labelEl.textContent = value; this.trigger.classList.remove('placeholder'); }
                else { this._applyPlaceholder(); }
                this.menu.querySelectorAll('.custom-select-option').forEach(el => {
                    el.classList.toggle('selected', el.dataset.value === value);
                });
            }
            _applyPlaceholder() { this.labelEl.textContent = this.placeholder; this.trigger.classList.add('placeholder'); }
            getValue() { return this.hiddenInput.value; }
            toggle() { this.menu.classList.contains('open') ? this.close() : this.open(); }
            open() {
                document.querySelectorAll('.custom-select-menu.open').forEach(m => { if (m !== this.menu) m.classList.remove('open'); });
                document.querySelectorAll('.custom-select-trigger.open').forEach(t => { if (t !== this.trigger) t.classList.remove('open'); });
                this.menu.classList.add('open'); this.trigger.classList.add('open');
            }
            close() { this.menu.classList.remove('open'); this.trigger.classList.remove('open'); }
        }

        let loginRoleSelect;

        window.onload = function() {
            const allowedRoles = ["مدير عام المكتب الفنى", "رئيس مجلس الإدارة"];
            let rolesSet = new Set();

            db.collection("users").get().then((querySnapshot) => {
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    let centralVal = String(data.centralManager || "").trim();
                    if (allowedRoles.includes(centralVal)) {
                        rolesSet.add(centralVal);
                    }
                });

                let rolesList = [...rolesSet].sort();
                if (rolesList.length > 0) {
                    loginRoleSelect = new CustomSelect('loginRoleWrap', rolesList, "");
                } else {
                    loginRoleSelect = new CustomSelect('loginRoleWrap', [], "");
                }
            }).catch(err => console.error(err));
        };

        function checkLogin() {
            const selectedRole = loginRoleSelect ? loginRoleSelect.getValue() : "";
            const pass = document.getElementById('loginPassword').value.trim();
            const errorMsg = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!selectedRole || !pass) {
                errorMsg.innerText = "يرجى اختيار المسمى الوظيفي وإدخال كلمة المرور";
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

            db.collection("users").where("centralManager", "==", selectedRole).get().then((querySnapshot) => {
                if (querySnapshot.empty) {
                    errorMsg.innerText = "لا يوجد مستخدم بهذا المسمى الوظيفي";
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                    return;
                }

                let isValid = false;
                let loggedInName = "";

                querySnapshot.forEach((doc) => {
                    let userData = doc.data();
                    let storedPassword = String(userData.password || "").trim();
                    if (storedPassword === pass) {
                        isValid = true;
                        loggedInName = userData.name || selectedRole;
                    }
                });

                if (isValid) {
                    currentUserName = loggedInName;
                    currentUserRole = selectedRole;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboardScreen').style.display = 'block';
                    document.getElementById('welcomeMsg').innerHTML = "أهلاً بك، " + currentUserName + " - " + currentUserRole + " 👋";
                    loadStats();
                } else {
                    errorMsg.innerText = "كلمة المرور غير صحيحة";
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                }
            }).catch(err => {
                errorMsg.innerText = "خطأ في الاتصال";
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            });
        }

        // === دالة تحديد "معلق عند" ===
        function enhanceStageText(stageText, reqObj) {
            if (!stageText) return "-";
            let s = String(stageText).trim();
            let sLower = s.toLowerCase();

            // 1. مراجعة المدير العام
            if (sLower.includes("مراجعة") && !sLower.includes("عقود") && !sLower.includes("أمر التوريد")) {
                let deptName = s.replace(/مراجعة\s*[-–]?\s*/, "").trim();
                if (deptName.length > 2) {
                    return "معلق عند: المدير العام (" + deptName + ")";
                }
                return "معلق عند: المدير العام";
            }

            // 2. مرحلة إنشاء أمر التوريد
            if (sLower.includes("إنشاء أمر التوريد") || sLower.includes("لإنشاء أمر التوريد") || s === "مراجعة -") {
                return "معلق عند: موظف العقود (لإصدار أمر التوريد)";
            }

            // 3. اعتماد مسودة أمر التوريد
            if (sLower.includes("مسودة") || (sLower.includes("مراجعة") && sLower.includes("عقود"))) {
                return "معلق عند: مدير العقود (لاعتماد المسودة)";
            }

            // 4. محول لأخذ رأي إدارة
            if (sLower.includes("بانتظار رأي") || sLower.includes("أخذ رأي") || sLower.includes("أخذ الرأي") || sLower.includes("استكمال")) {
                let dept = s.replace(/بانتظار رأي\s*[-–]?\s*/, "").replace(/أخذ رأي\s*[-–]?\s*/, "").replace(/أخذ الرأي\s*[-–]?\s*/, "").trim();
                if (dept.length > 0) return "معلق عند: " + dept + " (لإبداء الرأي)";
                return "معلق عند: الإدارات (لإبداء الرأي)";
            }

            // 5. اعتماد مالي
            if (sLower.includes("بانتظار اعتماد مالي") || sLower.includes("اعتماد مالي")) {
                return "معلق عند: رئيس الإدارة المركزية (اعتماد مالي)";
            }

            // 6. رئيس الإدارة المركزية
            if (sLower.includes("رئيس الإدارة المركزية")) {
                return "معلق عند: رئيس الإدارة المركزية";
            }

            // 7. رئيس مجلس الإدارة
            if (sLower.includes("رئيس مجلس") || sLower.includes("السلطة المختصة")) {
                return "معلق عند: رئيس مجلس الإدارة";
            }

            // 8. معتمد
            if (sLower.includes("معتمد") || sLower.includes("مقبول")) {
                return "تم الاعتماد نهائياً ✅";
            }

            // 9. مرفوض
            if (sLower.includes("مرفوض") || sLower.includes("رفض")) {
                return "تم الرفض ❌";
            }

            return s;
        }

        function getPurchaseStatus(row) {
            let stageVal = (row["Current_Stage"] || row["Status"] || "").toString().trim().toLowerCase();
            if (stageVal.includes("مرفوض") || stageVal.includes("رفض")) return "rejected";
            if (stageVal.includes("معتمد") || stageVal.includes("مقبول") || stageVal.includes("مؤرشف")) return "approved";
            return "pending";
        }

        function loadStats() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
            document.querySelectorAll('.number').forEach(el => el.innerText = '...');

            db.collection("requests").get().then((querySnapshot) => {
                globalPurchaseData = [];
                querySnapshot.forEach((doc) => {
                    let req = doc.data();
                    req.Request_ID = doc.id;
                    globalPurchaseData.push(req);
                });

                let pPending = 0, pApproved = 0, pRejected = 0;
                globalPurchaseData.forEach(row => {
                    let st = getPurchaseStatus(row);
                    if (st === 'rejected') pRejected++;
                    else if (st === 'approved') pApproved++;
                    else pPending++;
                });

                document.getElementById('purPending').innerText = pPending;
                document.getElementById('purApproved').innerText = pApproved;
                document.getElementById('purRejected').innerText = pRejected;
                document.getElementById('purTotal').innerText = globalPurchaseData.length;

            }).catch(err => {
                console.error(err);
            }).finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
            });
        }

        function openDetailsModal(type, status) {
            currentType = type;
            currentStatusFilter = status;
            let data = globalPurchaseData;

            let titleText = "";
            if (status === 'pending') { titleText = "طلبات المشتريات المعلقة"; currentActiveData = data.filter(row => getPurchaseStatus(row) === 'pending'); }
            else if (status === 'approved') { titleText = "طلبات المشتريات المعتمدة"; currentActiveData = data.filter(row => getPurchaseStatus(row) === 'approved'); }
            else if (status === 'rejected') { titleText = "طلبات المشتريات المرفوضة"; currentActiveData = data.filter(row => getPurchaseStatus(row) === 'rejected'); }
            else { titleText = "إجمالي طلبات المشتريات"; currentActiveData = data; }

            document.getElementById('modalTitle').innerText = titleText;
            document.getElementById('filterName').value = '';
            document.getElementById('filterSerial').value = '';

            renderCards(currentActiveData);
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function applyFilters() {
            let nameQuery = document.getElementById('filterName').value.trim().toLowerCase();
            let serialQuery = document.getElementById('filterSerial').value.trim().toLowerCase();

            let filtered = currentActiveData.filter(row => {
                let nameVal = (row["applicantName"] || "").toLowerCase();
                let serialVal = (row["Request_ID"] || "").toLowerCase();
                let matchName = !nameQuery || nameVal.includes(nameQuery);
                let matchSerial = !serialQuery || serialVal.includes(serialQuery);
                return matchName && matchSerial;
            });

            renderCards(filtered);
        }

        // === عرض الكروت ===
        function renderCards(data) {
            let container = document.getElementById('modalTableContainer');
            if (data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding: 20px; color: #94a3b8;">لا توجد طلبات مطابقة</p>';
                return;
            }

            let html = '';
            data.forEach((row, idx) => {
                let statusVal = getPurchaseStatus(row);
                let statusClass = statusVal === 'approved' ? 'status-approved' : (statusVal === 'rejected' ? 'status-rejected' : 'status-pending');
                let statusText = statusVal === 'approved' ? 'معتمد' : (statusVal === 'rejected' ? 'مرفوض' : 'معلق');

                let stageDisplay = enhanceStageText(row["Current_Stage"] || row["Status"]);
                let dateStr = row["Timestamp"] ? new Date(row["Timestamp"]).toLocaleDateString('ar-EG') : '-';

                html += `
                    <div class="data-card">
                        <div class="data-card-header">
                            <span class="data-card-title"><i class="fas fa-file-invoice"></i> ${row.Request_ID || '-'}</span>
                            <span class="data-card-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="data-card-body">
                            <div class="data-item">
                                <span class="lbl">مقدم الطلب</span>
                                <span class="val">${row.applicantName || '-'}</span>
                            </div>
                            <div class="data-item">
                                <span class="lbl">الوظيفة</span>
                                <span class="val">${row.role || '-'}</span>
                            </div>
                            <div class="data-item">
                                <span class="lbl">الإدارة</span>
                                <span class="val">${row.parentDepartment || '-'}</span>
                            </div>
                            <div class="data-item">
                                <span class="lbl">التكلفة</span>
                                <span class="val">${row.totalCost || '0'} ج.م</span>
                            </div>
                            <div class="data-item" style="grid-column: span 2;">
                                <span class="lbl">الطلب معلق عند</span>
                                <span class="val ${statusClass}">${stageDisplay}</span>
                            </div>
                            <div class="data-item">
                                <span class="lbl">اسم المدير</span>
                                <span class="val">${row.managerName || '-'}</span>
                            </div>
                            <div class="data-item">
                                <span class="lbl">التاريخ</span>
                                <span class="val">${dateStr}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        window.onclick = function(event) {
            let modal = document.getElementById('detailsModal');
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
