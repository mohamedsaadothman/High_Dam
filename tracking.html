<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة متابعة الإدارات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./logo.png">
    
    <!-- ✅ 1. كود حماية الصفحة (لازم تمر على الرئيسية الأول) -->
    <script>
        if (sessionStorage.getItem('app_access_token') !== 'granted') {
            alert("عذراً، يجب الدخول من الصفحة الرئيسية أولاً.");
            window.location.href = "index.html"; 
        }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('./hig.png') no-repeat center center fixed; background-size: cover; color: #fff; min-height: 100vh; padding-bottom: 20px; }
        
        header { background: rgba(15, 23, 42, 0.95); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #c59b27; position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-area img { width: 35px; height: 35px; border-radius: 50%; background: #fff; padding: 2px; border: 1px solid #c59b27; }
        .logo-area h1 { font-size: 14px; color: #fbbf24; margin: 0; font-weight: 900; }
        .back-btn { text-decoration: none; padding: 6px 12px; border-radius: 6px; background: #c59b27; color: #0f172a; font-weight: 700; font-size: 11px; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .back-btn:hover { background: #eab308; }
        
        .container { max-width: 1100px; margin: 15px auto; padding: 0 10px; }
        .page-title { text-align: center; margin-bottom: 20px; color: #fbbf24; font-size: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        .refresh-btn { background: #0d6efd; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-family: 'Cairo'; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .refresh-btn:hover { background: #0b5ed7; }
        .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .section-title { color: #cbd5e1; font-size: 15px; margin: 20px 0 10px 0; border-right: 4px solid #c59b27; padding-right: 8px; display: flex; align-items: center; gap: 6px; }

        /* ✅ 2. تظبيط الكروت (متجاوبة وصغيرة) */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* كرتين في الشاشات الصغيرة */
            gap: 10px; 
            margin-bottom: 15px; 
        }
        @media (min-width: 768px) {
            .stats-grid { 
                grid-template-columns: repeat(4, 1fr); /* 4 كروت بالعرض في الشاشات الكبيرة */
                gap: 15px;
            }
        }
        
        .stat-card { 
            padding: 12px 8px; 
            border-radius: 10px; 
            text-align: center; 
            color: #fff; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.3); 
            position: relative; 
            overflow: hidden;
        }
        .stat-card h3 { font-size: 11px; margin-bottom: 5px; opacity: 0.9; z-index: 2; position: relative; font-weight: 700;}
        .stat-card .number { font-size: 24px; font-weight: 900; z-index: 2; position: relative;}
        .stat-card i { position: absolute; left: -5px; bottom: -5px; font-size: 50px; opacity: 0.1; z-index: 1; }
        
        .card-yellow { background: linear-gradient(135deg, #d97706, #b45309); }
        .card-green { background: linear-gradient(135deg, #059669, #047857); }
        .card-red { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .card-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }

        .error-msg { text-align: center; padding: 15px; color: #f87171; font-size: 12px; background: rgba(220,38,38,0.1); border-radius: 8px; margin-top: 15px; display: none;}
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="./logo.png" alt="شعار">
            <h1>لوحة المتابعة المركزية</h1>
        </div>
        <a href="index.html" class="back-btn"><i class="fas fa-home"></i> الرئيسية</a>
    </header>

    <div class="container">
        <div class="page-title">
            <span><i class="fas fa-chart-pie"></i> إحصائيات حركة العمل</span>
            <button class="refresh-btn" id="refreshBtn" onclick="loadStats()"><i class="fas fa-sync-alt"></i> تحديث</button>
        </div>

        <div id="errorBox" class="error-msg"></div>

        <!-- قسم المشتريات -->
        <h2 class="section-title"><i class="fas fa-shopping-cart"></i> إدارة التعاقدات والمشتريات</h2>
        <div class="stats-grid">
            <div class="stat-card card-yellow">
                <h3><i class="fas fa-clock"></i> معلقة</h3>
                <div class="number" id="purPending">-</div>
                <i class="fas fa-hourglass-half"></i>
            </div>
            <div class="stat-card card-green">
                <h3><i class="fas fa-check-circle"></i> معتمدة</h3>
                <div class="number" id="purApproved">-</div>
                <i class="fas fa-check-double"></i>
            </div>
            <div class="stat-card card-red">
                <h3><i class="fas fa-times-circle"></i> مرفوضة</h3>
                <div class="number" id="purRejected">-</div>
                <i class="fas fa-ban"></i>
            </div>
            <div class="stat-card card-blue">
                <h3><i class="fas fa-list"></i> الإجمالي</h3>
                <div class="number" id="purTotal">-</div>
                <i class="fas fa-file-invoice"></i>
            </div>
        </div>

        <!-- قسم الإجازات -->
        <h2 class="section-title"><i class="fas fa-calendar-alt"></i> إدارة الإجازات</h2>
        <div class="stats-grid">
            <div class="stat-card card-yellow">
                <h3><i class="fas fa-clock"></i> معلقة</h3>
                <div class="number" id="leavePending">-</div>
                <i class="fas fa-hourglass-half"></i>
            </div>
            <div class="stat-card card-green">
                <h3><i class="fas fa-check-circle"></i> معتمدة</h3>
                <div class="number" id="leaveApproved">-</div>
                <i class="fas fa-check-double"></i>
            </div>
            <div class="stat-card card-red">
                <h3><i class="fas fa-times-circle"></i> مرفوضة</h3>
                <div class="number" id="leaveRejected">-</div>
                <i class="fas fa-ban"></i>
            </div>
            <div class="stat-card card-blue">
                <h3><i class="fas fa-list"></i> الإجمالي</h3>
                <div class="number" id="leaveTotal">-</div>
                <i class="fas fa-file-alt"></i>
            </div>
        </div>

    </div>

    <script>
        // ✅ 3. الرابط بتاعك
        const TRACKING_API_URL = "https://script.google.com/macros/s/AKfycbxoDTNrw26prqs9Vazmg5mBgrkRvgNL3KqfhmFexgyA7uys_8GTBoT6LY2HXgq5bad5mw/exec";

        function loadStats() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> تحديث...';
            
            document.getElementById('errorBox').style.display = 'none';
            document.querySelectorAll('.number').forEach(el => el.innerText = '...');

            fetch(TRACKING_API_URL + "?action=getStats")
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    // تحديث المشتريات
                    document.getElementById('purPending').innerText = data.purchases.pending;
                    document.getElementById('purApproved').innerText = data.purchases.approved;
                    document.getElementById('purRejected').innerText = data.purchases.rejected;
                    document.getElementById('purTotal').innerText = data.purchases.total;

                    // تحديث الإجازات
                    document.getElementById('leavePending').innerText = data.leaves.pending;
                    document.getElementById('leaveApproved').innerText = data.leaves.approved;
                    document.getElementById('leaveRejected').innerText = data.leaves.rejected;
                    document.getElementById('leaveTotal').innerText = data.leaves.total;
                } else {
                    showError("حدث خطأ: " + data.message);
                }
            })
            .catch(err => {
                console.error(err);
                showError("تعذر الاتصال بالخادم. تأكد من الرابط وصلاحيات النشر.");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
            });
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
            document.querySelectorAll('.number').forEach(el => el.innerText = '0');
        }

        // تشغيل تلقائي عند فتح الصفحة
        window.onload = loadStats;
    </script>
</body>
</html>
