<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام المحادثات الداخلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #0f172a; overflow: hidden; }
        header { position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 1000; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: space-between; align-items: center; padding: 0 10px; border-bottom: 2px solid #c59b27; }
        .logo-area { display: flex; align-items: center; gap: 8px; color: #fff; }
        .logo-area h1 { font-size: 13px; margin: 0; font-weight: 900; }
        .back-btn { text-decoration: none; padding: 6px 10px; border-radius: 6px; background: #fbbf24; color: #0f172a; font-weight: 700; font-size: 11px; }
        
        #loginScreen { position: absolute; top: 70px; left: 0; width: 100%; height: calc(100% - 70px); background: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; padding: 20px; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; width: 100%; max-width: 400px; }
        .login-box h2 { color: #fbbf24; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-family: inherit; }
        .login-box button { width: 100%; padding: 12px; background: #c59b27; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        #chatScreen { display: none; height: 100%; }
        .chat-wrapper { position: absolute; top: 85px; bottom: 15px; left: 15px; right: 15px; max-width: 900px; margin: 0 auto; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header-title { background: #0f172a; color: #fbbf24; padding: 12px; text-align: center; font-weight: 700; border-bottom: 2px solid #c59b27; display: flex; justify-content: space-between; align-items: center; }
        .notify-btn { background: #198754; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; display: block; }
        
        .messages { flex: 1; padding: 15px; overflow-y: auto; background: #0f172a; display: flex; flex-direction: column; gap: 10px; }
        .message { display: flex; flex-direction: column; max-width: 85%; position: relative; }
        .message .name { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        .message .text { background: #1e293b; color: #fff; padding: 10px 15px; border-radius: 15px; font-size: 14px; word-wrap: break-word; }
        .message.mine { align-self: flex-end; }
        .message.mine .text { background: #c59b27; color: #0f172a; font-weight: 700; }
        
        .message .time { font-size: 9px; color: #64748b; margin-top: 4px; align-self: flex-end; }
        .delete-btn { position: absolute; top: 5px; left: -25px; color: #ef4444; cursor: pointer; font-size: 14px; display: none; }
        .message:hover .delete-btn { display: block; }

        /* تنسيقات الصور والملفات */
        .message .text img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        .message .text a { color: #c59b27; text-decoration: underline; display: block; margin-top: 5px; }

        .input-area { background: #1e293b; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #334155; flex-wrap: wrap; align-items: center; }
        .input-area input, .input-area select { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
        .input-area input[type="text"] { flex: 1; }
        .input-area select { width: 220px; }
        .send-btn { background: #c59b27; color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 900; }
        .icon-btn { background: none; border: none; color: #c59b27; font-size: 18px; cursor: pointer; padding: 5px; }

        /* شارة الرسائل غير المقروءة */
        .unread-badge { background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-right: 5px; display: inline-block; }

        @media (max-width: 768px) { 
            .chat-wrapper { top: 75px; left: 10px; right: 10px; bottom: 10px; } 
            .input-area select { width: 100%; margin-bottom: 5px; } 
            .delete-btn { left: auto; right: 5px; background: rgba(0,0,0,0.5); border-radius: 50%; padding: 2px 5px; }
        }
    </style>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "446d368f-2d83-40e5-be23-106bd4f75ca5", 
          // ✅ تم التعديل هنا ليدور في نفس الفولدر بدل الـ Root
          serviceWorkerPath: "OneSignalSDKWorker.js", 
          serviceWorkerParam: { scope: "/" },
          allowLocalhostAsSecureOrigin: true
        });
      });
    </script>
</head>
<body>
    <header>
        <div class="logo-area"><h1>بوابة الخدمات الرقمية</h1></div>
        <a href="index.html" class="back-btn">الرئيسية</a>
    </header>
    <div id="loginScreen">
        <div class="login-box">
            <h2>تسجيل الدخول</h2>
            <input type="text" id="loginCode" placeholder="كود المستخدم (اسم المستخدم)">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
        </div>
    </div>
    <div id="chatScreen">
        <div class="chat-wrapper">
            <div class="chat-header-title">
                <span id="chatHeaderTitle">غرفة المحادثات</span>
                <button class="notify-btn" id="enableNotifyBtn" onclick="enablePushNotifications()">تفعيل الإشعارات</button>
            </div>
            <div class="messages" id="messagesDiv"></div>
            <div class="input-area">
                <select id="targetUserSelect" onchange="loadChatRoom()">
                    <option value="">اختر زميلاً للمراسلة...</option>
                </select>
                <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleEnter(event)">
                <button class="icon-btn" onclick="sendFileOrImage()" title="إرفاق رابط صورة أو ملف"><i class="fa-solid fa-paperclip"></i></button>
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, serverTimestamp, onValue, update, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGxjWSdyrPUpPKbXieSapBx--kUvRjwLY",
            authDomain: "chat-app-8df58.firebaseapp.com",
            databaseURL: "https://chat-app-8df58-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chat-app-8df58",
            storageBucket: "chat-app-8df58.firebasestorage.app",
            messagingSenderId: "59724152330",
            appId: "1:59724152330:web:2fe3c04b35dfa2e9cc69f3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesDiv = document.getElementById('messagesDiv');
        
        let myId = localStorage.getItem('chat_user_id') || "user_" + Math.floor(Math.random() * 100000);
        localStorage.setItem('chat_user_id', myId);
        
        let currentUserName = ""; 
        let currentUserCode = ""; 
        let allUsersList = [];
        
        const scriptUrl = "https://script.google.com/macros/s/AKfycbzAHjBagjtFC2kGKzf8VktCGHoaErOCQPfAXETZwgRalWgxegA1XRTkxqkx80zgH9by1Q/exec";

        async function sendNotificationToUser(targetUserCode, messageText) {
            try {
                await fetch(scriptUrl, { 
                    method: 'POST', 
                    body: JSON.stringify({
                        action: 'sendPush', targetName: targetUserCode, messageText: messageText, name: currentUserName    
                    }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
            } catch (error) { console.error("خطأ في الإشعار:", error); }
        }

        window.enablePushNotifications = async function() {
            OneSignalDeferred.push(async function(OneSignal) {
                const permission = await OneSignal.Notifications.requestPermission();
                if (permission) {
                    await OneSignal.login(currentUserCode); 
                    document.getElementById('enableNotifyBtn').style.display = 'none';
                    alert("تم تفعيل الإشعارات بنجاح!");
                }
            });
        }

        window.login = async function() {
            const codeInput = document.getElementById('loginCode').value.trim();
            const passInput = document.getElementById('loginPassword').value.trim();
            if (!codeInput || !passInput) { alert("الرجاء إدخال البيانات"); return; }

            try {
                document.querySelector('#loginScreen button').innerText = "جاري التحقق...";
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username: codeInput, password: passInput }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();

                if (result.status === 'success') {
                    currentUserName = result.empName; 
                    currentUserCode = codeInput;      
                    
                    OneSignalDeferred.push(async function(OneSignal) { await OneSignal.login(currentUserCode); });

                    document.getElementById('chatHeaderTitle').innerText = "مرحباً: " + currentUserName;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('chatScreen').style.display = 'block';
                    document.getElementById('enableNotifyBtn').style.display = 'block';

                    const usersResponse = await fetch(scriptUrl);
                    allUsersList = await usersResponse.json();

                    const select = document.getElementById('targetUserSelect');
                    select.innerHTML = '<option value="">اختر زميلاً للمراسلة...</option>';
                    
                    allUsersList.forEach(u => {
                        if (u.empName && u.username !== codeInput) {
                            select.innerHTML += `<option value="${u.username}" id="user_${u.username}">${u.empName}</option>`;
                        }
                    });

                } else {
                    alert(result.message || "بيانات الدخول غير صحيحة");
                    document.querySelector('#loginScreen button').innerText = "دخول";
                }
            } catch (error) {
                alert("خطأ في الاتصال بالسيرفر");
                document.querySelector('#loginScreen button').innerText = "دخول";
            }
        }

        function getChatRoomId(code1, code2) {
            let sorted = [code1, code2].sort();
            return sorted[0] + "_" + sorted[1];
        }

        window.loadChatRoom = function() {
            const targetUserCode = document.getElementById('targetUserSelect').value; 
            if (!targetUserCode) return;

            let roomId = getChatRoomId(currentUserCode, targetUserCode);

            onValue(ref(db, 'chats/' + roomId), (snapshot) => {
                messagesDiv.innerHTML = '';
                const msgs = snapshot.val();
                if (msgs) {
                    let sorted = Object.values(msgs).sort((a, b) => a.timestamp - b.timestamp);
                    sorted.forEach(msg => {
                        if (msg.deletedFor && msg.deletedFor.includes(currentUserCode)) return;

                        const msgDiv = document.createElement('div');
                        msgDiv.className = msg.userId === myId ? 'message mine' : 'message';
                        
                        let date = new Date(msg.timestamp);
                        let msgTime = date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) + " - " + date.toLocaleDateString('ar-EG');
                        let deleteBtn = msg.userId === myId ? `<i class="fa-solid fa-trash delete-btn" onclick="deleteMessage('${roomId}', '${msg.id}')" title="حذف الرسالة"></i>` : '';

                        // تنسيق النص لو كان صورة أو ملف
                        let textContent = msg.text;
                        if (msg.type === 'image') {
                            textContent = `<img src="${msg.text}" alt="صورة">`;
                        } else if (msg.type === 'file') {
                            textContent = `<a href="${msg.text}" target="_blank"><i class="fa-solid fa-file"></i> تحميل الملف</a>`;
                        }

                        msgDiv.innerHTML = `
                            ${deleteBtn}
                            <span class="name">${msg.name}</span>
                            <span class="text">${textContent}</span>
                            <span class="time">${msgTime}</span>
                        `;
                        messagesDiv.appendChild(msgDiv);
                    });
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            });
        };

        window.deleteMessage = async function(roomId, msgId) {
            if(confirm("هل أنت متأكد من حذف الرسالة لديك فقط؟")) {
                const msgRef = ref(db, `chats/${roomId}/${msgId}`);
                onValue(msgRef, async (snapshot) => {
                    const msgData = snapshot.val();
                    if(msgData) {
                        let deletedFor = msgData.deletedFor || [];
                        if(!deletedFor.includes(currentUserCode)) {
                            deletedFor.push(currentUserCode);
                            await update(msgRef, { deletedFor: deletedFor });
                        }
                    }
                }, { onlyOnce: true });
            }
        }

        window.sendMessage = function() {
            const text = document.getElementById('msgInput').value.trim();
            const targetUserCode = document.getElementById('targetUserSelect').value; 
            if (!text) return;
            if (!targetUserCode) { alert("الرجاء اختيار الزميل أولاً"); return; }

            let roomId = getChatRoomId(currentUserCode, targetUserCode);
            const newMsgRef = push(ref(db, 'chats/' + roomId));

            set(newMsgRef, { 
                id: newMsgRef.key,
                name: currentUserName, 
                text: text, 
                type: 'text',
                userId: myId, 
                timestamp: serverTimestamp() 
            });

            sendNotificationToUser(targetUserCode, "رسالة جديدة من " + currentUserName + ": " + text);
            document.getElementById('msgInput').value = '';
        };

        // دالة إرسال صورة أو ملف عن طريق الرابط
        window.sendFileOrImage = function() {
            const targetUserCode = document.getElementById('targetUserSelect').value; 
            if (!targetUserCode) { alert("الرجاء اختيار الزميل أولاً"); return; }
            
            const url = prompt("ضع رابط الصورة أو الملف هنا:");
            if (!url) return;

            let type = 'file';
            if (url.match(/\.(jpeg|jpg|gif|png)$/) != null) {
                type = 'image';
            }

            let roomId = getChatRoomId(currentUserCode, targetUserCode);
            const newMsgRef = push(ref(db, 'chats/' + roomId));

            set(newMsgRef, { 
                id: newMsgRef.key,
                name: currentUserName, 
                text: url, 
                type: type,
                userId: myId, 
                timestamp: serverTimestamp() 
            });

            sendNotificationToUser(targetUserCode, "أرسل لك " + (type === 'image' ? 'صورة' : 'ملف') + " من " + currentUserName);
        };

        window.handleEnter = function(event) { if (event.key === 'Enter') { event.preventDefault(); sendMessage(); } };
    </script>
</body>
</html>
