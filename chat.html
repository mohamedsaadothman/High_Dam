<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدعم الفني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #0f172a; overflow: hidden; }
        header { position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 1000; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: space-between; align-items: center; padding: 0 10px; border-bottom: 2px solid #c59b27; }
        .logo-area { display: flex; align-items: center; gap: 8px; color: #fff; }
        .logo-area h1 { font-size: 13px; margin: 0; font-weight: 900; }
        .back-btn { text-decoration: none; padding: 6px 10px; border-radius: 6px; background: #fbbf24; color: #0f172a; font-weight: 700; font-size: 11px; }
        #loginScreen { position: absolute; top: 70px; left: 0; width: 100%; height: calc(100% - 70px); background: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; padding: 20px; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; width: 100%; max-width: 400px; }
        .login-box h2 { color: #fbbf24; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-family: inherit; }
        .login-box button { width: 100%; padding: 12px; background: #c59b27; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #chatScreen { display: none; height: 100%; }
        .chat-wrapper { position: absolute; top: 85px; bottom: 15px; left: 15px; right: 15px; max-width: 900px; margin: 0 auto; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header-title { background: #0f172a; color: #fbbf24; padding: 12px; text-align: center; font-weight: 700; border-bottom: 2px solid #c59b27; display: flex; justify-content: space-between; align-items: center; }
        .notify-btn { background: #198754; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; display: block; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; background: #0f172a; display: flex; flex-direction: column; gap: 10px; }
        .message { display: flex; flex-direction: column; max-width: 85%; }
        .message .name { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        .message .text { background: #1e293b; color: #fff; padding: 10px 15px; border-radius: 15px; font-size: 14px; }
        .message.mine { align-self: flex-end; }
        .message.mine .text { background: #c59b27; color: #0f172a; font-weight: 700; }
        .input-area { background: #1e293b; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #334155; flex-wrap: wrap; }
        .input-area input, .input-area select { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
        .input-area input { flex: 1; }
        .input-area select { width: 200px; display: none; }
        .send-btn { background: #c59b27; color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 900; }
        @media (max-width: 768px) { .chat-wrapper { top: 75px; left: 10px; right: 10px; bottom: 10px; } .input-area select { width: 100%; margin-bottom: 5px; } }
    </style>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "446d368f-2d83-40e5-be23-106bd4f75ca5", 
          serviceWorkerPath: "High_Dam/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/High_Dam/" },
          allowLocalhostAsSecureOrigin: true
        });
      });
    </script>
</head>
<body>
    <script>
        if (sessionStorage.getItem("visited_from_home") !== "true") {
            alert("عذراً، يجب الدخول من الصفحة الرئيسية أولاً.");
            window.location.href = "index.html";
        }
    </script>
    <header>
        <div class="logo-area"><h1>بوابة الخدمات الرقمية</h1></div>
        <a href="index.html" class="back-btn">الرئيسية</a>
    </header>
    <div id="loginScreen">
        <div class="login-box">
            <h2>تسجيل الدخول</h2>
            <input type="text" id="loginName" placeholder="الاسم">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
        </div>
    </div>
    <div id="chatScreen">
        <div class="chat-wrapper">
            <div class="chat-header-title">
                <span id="chatHeaderTitle">غرفة الدعم</span>
                <button class="notify-btn" id="enableNotifyBtn" onclick="enablePushNotifications()">تفعيل الإشعارات</button>
            </div>
            <div class="messages" id="messagesDiv"></div>
            <div class="input-area">
                <select id="adminUserSelect" style="display: none;"><option value="">اختر موظف للرد عليه...</option></select>
                <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, serverTimestamp, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGxjWSdyrPUpPKbXieSapBx--kUvRjwLY",
            authDomain: "chat-app-8df58.firebaseapp.com",
            databaseURL: "https://chat-app-8df58-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chat-app-8df58",
            storageBucket: "chat-app-8df58.firebasestorage.app",
            messagingSenderId: "59724152330",
            appId: "1:59724152330:web:2fe3c04b35dfa2e9cc69f3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesDiv = document.getElementById('messagesDiv');
        let myId = localStorage.getItem('chat_user_id') || "user_" + Math.floor(Math.random() * 100000);
        localStorage.setItem('chat_user_id', myId);
        let currentUserName = "";
        let isAdmin = false;
        const adminName = "محمد سعد عثمان أحمد"; 
        
        // ⚠️ ضع الرابط الجديد لـ Apps Script هنا
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwmbLoaAEGLpnFW7yQLdqI1v0voHwCmsniaEALx0q4Sh8mOiDiU8G6DyFoZJzv7CUOFFg/exec";

        function normalizeText(text) {
            if (!text) return "";
            return text.toString().trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').toLowerCase(); 
        }

        async function sendNotificationToUser(targetUserName, messageText) {
            const data = new URLSearchParams();
            data.append('action', 'sendPush');
            data.append('targetName', targetUserName);
            data.append('messageText', messageText);
            try {
                await fetch(scriptUrl, { method: 'POST', body: data, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
            } catch (error) {}
        }

        window.enablePushNotifications = async function() {
            OneSignalDeferred.push(async function(OneSignal) {
                const permission = await OneSignal.Notifications.requestPermission();
                if (permission) {
                    await OneSignal.login(currentUserName);
                    document.getElementById('enableNotifyBtn').style.display = 'none';
                    alert("تم تفعيل الإشعارات بنجاح!");
                }
            });
        }

        window.login = async function() {
            const nameInput = document.getElementById('loginName').value;
            const passInput = document.getElementById('loginPassword').value;
            if (!nameInput || !passInput) { alert("الرجاء إدخال البيانات"); return; }

            try {
                document.querySelector('#loginScreen button').innerText = "جاري التحقق...";
                const response = await fetch(scriptUrl);
                const users = await response.json();
                const user = users.find(u => normalizeText(u.name) === normalizeText(nameInput) && normalizeText(u.password) === normalizeText(passInput));

                if (user) {
                    currentUserName = nameInput.trim(); 
                    localStorage.setItem('chat_user_name', currentUserName);
                    
                    OneSignalDeferred.push(async function(OneSignal) {
                        await OneSignal.login(currentUserName);
                    });

                    if (normalizeText(currentUserName) === normalizeText(adminName)) {
                        isAdmin = true;
                        document.getElementById('chatHeaderTitle').innerText = "لوحة التحكم (أدمن)";
                        document.getElementById('adminUserSelect').style.display = 'block'; 
                    } else {
                        isAdmin = false;
                        document.getElementById('chatHeaderTitle').innerText = "غرفة الدعم - " + currentUserName;
                    }

                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('chatScreen').style.display = 'block';
                    document.getElementById('enableNotifyBtn').style.display = 'block';

                    if (isAdmin) {
                        onValue(ref(db, 'private_chats'), (snapshot) => {
                            messagesDiv.innerHTML = ''; 
                            const allChats = snapshot.val();
                            const select = document.getElementById('adminUserSelect');
                            select.innerHTML = '<option value="">اختر موظف للرد عليه...</option>';
                            if (allChats) {
                                let allMessages = [];
                                for (let userRoom in allChats) {
                                    select.innerHTML += `<option value="${userRoom}">${userRoom}</option>`;
                                    for (let msgId in allChats[userRoom]) {
                                        let msg = allChats[userRoom][msgId];
                                        msg.senderRoom = userRoom;
                                        allMessages.push(msg);
                                    }
                                }
                                allMessages.sort((a, b) => a.timestamp - b.timestamp);
                                allMessages.forEach(msg => {
                                    const msgDiv = document.createElement('div');
                                    msgDiv.className = msg.userId === myId ? 'message mine' : 'message';
                                    msgDiv.innerHTML = `<span class="name">${msg.userId === myId ? 'أنت' : msg.name} (${msg.senderRoom})</span><span class="text">${msg.text}</span>`;
                                    messagesDiv.appendChild(msgDiv);
                                });
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            }
                        });
                    } else {
                        onValue(ref(db, 'private_chats/' + normalizeText(currentUserName)), (snapshot) => {
                            messagesDiv.innerHTML = '';
                            const msgs = snapshot.val();
                            if(msgs){
                                let sorted = Object.values(msgs).sort((a,b)=>a.timestamp - b.timestamp);
                                sorted.forEach(msg => {
                                    const msgDiv = document.createElement('div');
                                    msgDiv.className = msg.userId === myId ? 'message mine' : 'message';
                                    msgDiv.innerHTML = `<span class="name">${msg.name}</span><span class="text">${msg.text}</span>`;
                                    messagesDiv.appendChild(msgDiv);
                                });
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            }
                        });
                    }

                    const emailData = new URLSearchParams();
                    emailData.append('action', 'loginNotification');
                    emailData.append('name', currentUserName);
                    fetch(scriptUrl, { method: 'POST', body: emailData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });

                } else {
                    alert("بيانات الدخول غير صحيحة");
                    document.querySelector('#loginScreen button').innerText = "دخول";
                }
            } catch (error) {
                alert("خطأ في الاتصال");
                document.querySelector('#loginScreen button').innerText = "دخول";
            }
        }

        window.sendMessage = function() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text) return;

            if (isAdmin) {
                const targetRoom = document.getElementById('adminUserSelect').value;
                if (!targetRoom) { alert("اختر الموظف أولاً"); return; }
                push(ref(db, 'private_chats/' + targetRoom), { name: "الدعم الفني", text: text, userId: myId, timestamp: serverTimestamp() });
                sendNotificationToUser(targetRoom, "رد جديد من الدعم: " + text);
            } else {
                push(ref(db, 'private_chats/' + normalizeText(currentUserName)), { name: currentUserName, text: text, userId: myId, timestamp: serverTimestamp() });
                sendNotificationToUser(adminName, "رسالة من " + currentUserName + ": " + text);
            }
            document.getElementById('msgInput').value = '';
        };

        window.handleEnter = function(event) { if (event.key === 'Enter') { event.preventDefault(); sendMessage(); } };
    </script>
</body>
</html>
