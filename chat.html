<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدردشة الفورية - بوابة الخدمات الرقمية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./logo.png">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #0f172a; overflow: hidden; }

        /* --- الهيدر (نفس تصميم الرئيسية) --- */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 1000;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center; padding: 0 10px;
            border-bottom: 2px solid #c59b27;
        }

        .logo-area { display: flex; align-items: center; gap: 8px; color: #fff; }
        .logo-area img { width: 38px; height: 38px; border-radius: 50%; object-fit: contain; background: #fff; padding: 2px; border: 1px solid #c59b27; flex-shrink: 0;}
        
        .logo-area h1 { font-size: 13px; margin: 0; font-weight: 900; white-space: nowrap; }
        .logo-area span { font-size: 9px; color: #94a3b8; display: block; white-space: nowrap; }
        
        .header-actions { display: flex; gap: 6px; }
        
        .back-btn {
            text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; 
            display: flex; align-items: center; gap: 4px; cursor: pointer; border: none; transition: 0.3s;
            background: #fbbf24; color: #0f172a;
        }
        .back-btn:hover { background: #d9a01a; }

        /* --- حاوية الدردشة --- */
        .chat-wrapper {
            position: absolute; top: 85px; bottom: 15px; left: 15px; right: 15px;
            max-width: 600px; margin: 0 auto;
            background: #1e293b; border-radius: 12px; border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .chat-header-title {
            background: #0f172a; color: #fbbf24; padding: 12px; text-align: center; 
            font-weight: 700; border-bottom: 2px solid #c59b27; font-size: 16px;
        }

        /* --- منطقة الرسائل --- */
        .messages {
            flex: 1; padding: 15px; overflow-y: auto; background: #0f172a;
            display: flex; flex-direction: column; gap: 10px;
        }

        .message { display: flex; flex-direction: column; max-width: 85%; }
        .message .name { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        .message .text { 
            background: #1e293b; color: #fff; padding: 10px 15px; 
            border-radius: 15px; border-top-right-radius: 0; font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); word-wrap: break-word;
        }
        
        /* رسائلي أنا (تظهر بلون ذهبي مميز) */
        .message.mine { align-self: flex-end; }
        .message.mine .name { text-align: left; }
        .message.mine .text { 
            background: #c59b27; color: #0f172a; font-weight: 700;
            border-top-right-radius: 15px; border-top-left-radius: 0; 
        }

        /* --- منطقة الإدخال --- */
        .input-area {
            background: #1e293b; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #334155;
        }
        
        .input-area input {
            padding: 10px; border-radius: 8px; border: 1px solid #334155;
            background: #0f172a; color: #fff; outline: none; font-family: inherit; font-size: 14px;
        }
        .input-area input:focus { border-color: #c59b27; }
        
        #nameInput { width: 90px; flex-shrink: 0; }
        #msgInput { flex: 1; }
        
        .send-btn {
            background: #c59b27; color: #0f172a; border: none; padding: 10px 20px; 
            border-radius: 8px; cursor: pointer; font-weight: 900; font-family: inherit; 
            transition: 0.3s; flex-shrink: 0;
        }
        .send-btn:hover { background: #d9a01a; }

        /* --- تعديلات الموبايل --- */
        @media (max-width: 768px) {
            header { padding: 0 8px; height: 65px; }
            .logo-area { gap: 5px; }
            .logo-area img { width: 32px; height: 32px; }
            .logo-area h1 { font-size: 11px; }
            .logo-area span { font-size: 8px; }
            .back-btn { padding: 5px 8px; font-size: 10px; }
            .chat-wrapper { top: 75px; left: 10px; right: 10px; bottom: 10px; }
            #nameInput { width: 70px; }
        }
    </style>
</head>
<body>

    <!-- الهيدر الخاص بالهيئة -->
    <header>
        <div class="logo-area">
            <img src="./logo.png" alt="شعار الهيئة">
            <div>
                <h1>بوابة الخدمات الرقمية</h1>
                <span>الهيئة العامة للسد العالي وخزان أسوان</span>
            </div>
        </div>
        <div class="header-actions">
            <a href="index.html" class="back-btn" title="العودة للرئيسية">
                <i class="fas fa-home"></i> الرئيسية
            </a>
        </div>
    </header>

    <!-- واجهة الدردشة -->
    <div class="chat-wrapper">
        <div class="chat-header-title">
            <i class="fas fa-comments"></i> غرفة الدردشة الفورية
        </div>
        
        <div class="messages" id="messagesDiv"></div>
        
        <div class="input-area">
            <input type="text" id="nameInput" placeholder="اسمك...">
            <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <!-- كود Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // إعدادات Firebase (تم دمج بياناتك بنجاح)
        const firebaseConfig = {
            apiKey: "AIzaSyCGxjWSdyrPUpPKbXieSapBx--kUvRjwLY",
            authDomain: "chat-app-8df58.firebaseapp.com",
            databaseURL: "https://chat-app-8df58-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chat-app-8df58",
            storageBucket: "chat-app-8df58.firebasestorage.app",
            messagingSenderId: "59724152330",
            appId: "1:59724152330:web:2fe3c04b35dfa2e9cc69f3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');
        const messagesDiv = document.getElementById('messagesDiv');
        
        // إنشاء معرف ثابت للمستخدم لكل متصفح
        let myId = localStorage.getItem('chat_user_id');
        if (!myId) {
            myId = "user_" + Math.floor(Math.random() * 100000);
            localStorage.setItem('chat_user_id', myId);
        }

        // حفظ الاسم تلقائياً حتى لا يكتبه كل مرة
        const nameInput = document.getElementById('nameInput');
        nameInput.value = localStorage.getItem('chat_user_name') || '';

        // الاستماع للرسائل الجديدة
        onChildAdded(messagesRef, (snapshot) => {
            const msg = snapshot.val();
            const msgDiv = document.createElement('div');
            msgDiv.className = msg.userId === myId ? 'message mine' : 'message';
            
            msgDiv.innerHTML = `
                <span class="name">${msg.name}</span>
                <span class="text">${msg.text}</span>
            `;
            
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // إرسال الرسالة
        window.sendMessage = function() {
            const name = nameInput.value.trim() || 'مجهول';
            const text = document.getElementById('msgInput').value.trim();
            
            if (!text) return;

            // حفظ الاسم في المتصفح
            localStorage.setItem('chat_user_name', name);

            push(messagesRef, {
                name: name,
                text: text,
                userId: myId,
                timestamp: serverTimestamp()
            });

            document.getElementById('msgInput').value = '';
        };

        // تفعيل زر Enter للإرسال
        window.handleEnter = function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        };
    </script>
</body>
</html>
