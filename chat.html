<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدعم الفني - بوابة الخدمات الرقمية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./logo.png">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #0f172a; overflow: hidden; }

        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 1000;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center; padding: 0 10px;
            border-bottom: 2px solid #c59b27;
        }

        .logo-area { display: flex; align-items: center; gap: 8px; color: #fff; }
        .logo-area img { width: 38px; height: 38px; border-radius: 50%; object-fit: contain; background: #fff; padding: 2px; border: 1px solid #c59b27; flex-shrink: 0;}
        .logo-area h1 { font-size: 13px; margin: 0; font-weight: 900; white-space: nowrap; }
        .logo-area span { font-size: 9px; color: #94a3b8; display: block; white-space: nowrap; }
        
        .header-actions { display: flex; gap: 6px; }
        .back-btn {
            text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; 
            display: flex; align-items: center; gap: 4px; cursor: pointer; border: none; transition: 0.3s;
            background: #fbbf24; color: #0f172a;
        }

        #loginScreen {
            position: absolute; top: 70px; left: 0; width: 100%; height: calc(100% - 70px);
            background: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 500; padding: 20px;
        }
        .login-box {
            background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155;
            text-align: center; width: 100%; max-width: 400px;
        }
        .login-box h2 { color: #fbbf24; margin-bottom: 20px; font-size: 20px; }
        .login-box input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px;
            border: 1px solid #334155; background: #0f172a; color: #fff; font-family: inherit;
        }
        .login-box button {
            width: 100%; padding: 12px; background: #c59b27; color: #0f172a;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit;
        }

        #chatScreen { display: none; height: 100%; }
        
        .chat-wrapper {
            position: absolute; top: 85px; bottom: 15px; left: 15px; right: 15px;
            max-width: 900px; margin: 0 auto;
            background: #1e293b; border-radius: 12px; border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .chat-header-title {
            background: #0f172a; color: #fbbf24; padding: 12px; text-align: center; 
            font-weight: 700; border-bottom: 2px solid #c59b27; font-size: 16px;
            display: flex; justify-content: space-between; align-items: center; padding: 12px 15px;
        }
        
        /* تنسيق زرار تفعيل الإشعارات */
        .notify-btn {
            background: #198754; color: white; border: none; padding: 5px 10px; 
            border-radius: 5px; font-size: 11px; cursor: pointer; display: none;
        }

        .messages { flex: 1; padding: 15px; overflow-y: auto; background: #0f172a; display: flex; flex-direction: column; gap: 10px; }
        .message { display: flex; flex-direction: column; max-width: 85%; }
        .message .name { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        .message .text { background: #1e293b; color: #fff; padding: 10px 15px; border-radius: 15px; border-top-right-radius: 0; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); word-wrap: break-word; }
        
        .message.mine { align-self: flex-end; }
        .message.mine .name { text-align: left; }
        .message.mine .text { background: #c59b27; color: #0f172a; font-weight: 700; border-top-right-radius: 15px; border-top-left-radius: 0; }

        .input-area { background: #1e293b; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #334155; flex-wrap: wrap; }
        .input-area input, .input-area select { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; font-family: inherit; font-size: 14px; }
        .input-area input { flex: 1; }
        .input-area select { width: 200px; display: none; font-weight: bold; color: #fbbf24; } 
        .send-btn { background: #c59b27; color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 900; font-family: inherit; transition: 0.3s; flex-shrink: 0; }

        @media (max-width: 768px) {
            header { padding: 0 8px; height: 65px; }
            .logo-area img { width: 32px; height: 32px; }
            .logo-area h1 { font-size: 11px; }
            .back-btn { padding: 5px 8px; font-size: 10px; }
            .chat-wrapper { top: 75px; left: 10px; right: 10px; bottom: 10px; max-width: 100%; }
            .input-area select { width: 100%; margin-bottom: 5px; }
        }
    </style>

    <!-- كود إشعارات OneSignal -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "446d368f-2d83-40e5-be23-106bd4f75ca5", 
          serviceWorkerPath: "High_Dam/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/High_Dam/" },
          allowLocalhostAsSecureOrigin: true
        });
      });
    </script>
</head>
<body>

    <script>
        // منع الدخول المباشر للصفحة بدون المرور على الصفحة الرئيسية
        if (sessionStorage.getItem("visited_from_home") !== "true") {
            alert("عذراً، يجب الدخول من الصفحة الرئيسية أولاً.");
            window.location.href = "index.html";
        }
    </script>

    <header>
        <div class="logo-area">
            <img src="./logo.png" alt="شعار الهيئة">
            <div>
                <h1>بوابة الخدمات الرقمية</h1>
                <span>الهيئة العامة للسد العالي وخزان أسوان</span>
            </div>
        </div>
        <div class="header-actions">
            <a href="index.html" class="back-btn"><i class="fas fa-home"></i> الرئيسية</a>
        </div>
    </header>

    <div id="loginScreen">
        <div class="login-box">
            <h2><i class="fas fa-headset"></i> تسجيل الدخول للدعم الفني</h2>
            <input type="text" id="loginName" placeholder="الاسم">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
        </div>
    </div>

    <div id="chatScreen">
        <div class="chat-wrapper">
            <div class="chat-header-title">
                <span id="chatHeaderTitle"><i class="fas fa-headset"></i> غرفة الدعم الفني</span>
                <!-- زرار تفعيل الإشعارات -->
                <button class="notify-btn" id="enableNotifyBtn" onclick="enablePushNotifications()">تفعيل الإشعارات</button>
            </div>
            <div class="messages" id="messagesDiv"></div>
            <div class="input-area">
                <select id="adminUserSelect" style="display: none;">
                    <option value="">اختر موظف للرد عليه...</option>
                </select>
                <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGxjWSdyrPUpPKbXieSapBx--kUvRjwLY",
            authDomain: "chat-app-8df58.firebaseapp.com",
            databaseURL: "https://chat-app-8df58-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chat-app-8df58",
            storageBucket: "chat-app-8df58.firebasestorage.app",
            messagingSenderId: "59724152330",
            appId: "1:59724152330:web:2fe3c04b35dfa2e9cc69f3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesDiv = document.getElementById('messagesDiv');
        
        let myId = localStorage.getItem('chat_user_id') || "user_" + Math.floor(Math.random() * 100000);
        localStorage.setItem('chat_user_id', myId);

        let currentUserName = "";
        let isAdmin = false;

        const adminName = "محمد سعد عثمان أحمد"; 
        
        // رابط Google Apps Script
        const scriptUrl = "https://script.google.com/macros/s/AKfycbyvum9CJcWIg1MnWSxlAWHEymgNODANibaGUOolBc5-GYexvfmhlIAnQWGto8gEMR01_g/exec";

        function normalizeText(text) {
            if (!text) return "";
            return text.toString().trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').toLowerCase(); 
        }

        // دالة إرسال الإشعار
        async function sendNotificationToUser(targetUserName, messageText) {
            const data = new URLSearchParams();
            data.append('action', 'sendPush');
            data.append('targetName', targetUserName);
            data.append('messageText', messageText);

            try {
                await fetch(scriptUrl, {
                    method: 'POST',
                    body: data,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
            } catch (error) {
                console.error("خطأ في إرسال الإشعار:", error);
            }
        }

        // دالة تفعيل الإشعارات (القوية)
        window.enablePushNotifications = async function() {
            OneSignalDeferred.push(async function(OneSignal) {
                try {
                    // طلب الإذن مباشرة
                    const permission = await OneSignal.Notifications.requestPermission();
                    
                    if (permission) {
                        // تسجيل الاسم في OneSignal
                        await OneSignal.login(currentUserName);
                        document.getElementById('enableNotifyBtn').style.display = 'none';
                        alert("تم تفعيل الإشعارات بنجاح! ستصلك تنبيهات بالرسائل الجديدة.");
                    } else {
                        alert("لم يتم تفعيل الإشعارات. يرجى التأكد من السماح للمتصفح بالإشعارات.");
                    }
                } catch (error) {
                    console.error("خطأ في تفعيل الإشعارات:", error);
                }
            });
        }

        window.login = async function() {
            const nameInput = document.getElementById('loginName').value;
            const passInput = document.getElementById('loginPassword').value;

            if (!nameInput || !passInput) {
                alert("الرجاء إدخال الاسم وكلمة المرور");
                return;
            }

            try {
                const btn = document.querySelector('#loginScreen button');
                btn.innerText = "جاري التحقق...";

                const response = await fetch(scriptUrl);
                const users = await response.json();

                const cleanInputName = normalizeText(nameInput);
                const cleanInputPass = normalizeText(passInput);

                const user = users.find(u => u.name === cleanInputName && u.password === cleanInputPass);

                if (user) {
                    currentUserName = nameInput.trim(); 
                    localStorage.setItem('chat_user_name', currentUserName);
                    
                    OneSignalDeferred.push(async function(OneSignal) {
                        await OneSignal.login(currentUserName);
                    });

                    if (normalizeText(currentUserName) === normalizeText(adminName)) {
                        isAdmin = true;
                        document.getElementById('chatHeaderTitle').innerHTML = `<i class="fas fa-user-shield"></i> لوحة تحكم الدعم الفني (أدمن)`;
                        document.getElementById('adminUserSelect').style.display = 'block'; 
                    } else {
                        isAdmin = false;
                        document.getElementById('chatHeaderTitle').innerHTML = `<i class="fas fa-headset"></i> غرفة الدعم الفني - ${currentUserName}`;
                    }

                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('chatScreen').style.display = 'block';

                    // إظهار زر تفعيل الإشعارات دائماً عند الدخول
                    document.getElementById('enableNotifyBtn').style.display = 'block';

                    if (isAdmin) {
                        const allChatsRef = ref(db, 'private_chats');
                        onValue(allChatsRef, (snapshot) => {
                            messagesDiv.innerHTML = ''; 
                            const allChats = snapshot.val();
                            const select = document.getElementById('adminUserSelect');
                            select.innerHTML = '<option value="">اختر موظف للرد عليه...</option>';
                            
                            if (allChats) {
                                let allMessages = [];
                                for (let userRoom in allChats) {
                                    select.innerHTML += `<option value="${userRoom}">${userRoom}</option>`;
                                    for (let msgId in allChats[userRoom]) {
                                        let msg = allChats[userRoom][msgId];
                                        msg.senderRoom = userRoom;
                                        allMessages.push(msg);
                                    }
                                }
                                allMessages.sort((a, b) => a.timestamp - b.timestamp);
                                allMessages.forEach(msg => {
                                    const msgDiv = document.createElement('div');
                                    if (msg.userId === myId) {
                                        msgDiv.className = 'message mine'; 
                                        msgDiv.innerHTML = `<span class="name">أنت (للموظف: ${msg.senderRoom})</span><span class="text">${msg.text}</span>`;
                                    } else {
                                        msgDiv.className = 'message'; 
                                        msgDiv.innerHTML = `<span class="name">${msg.name} (غرفة: ${msg.senderRoom})</span><span class="text">${msg.text}</span>`;
                                    }
                                    messagesDiv.appendChild(msgDiv);
                                });
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            }
                        });
                    } else {
                        const privateRoomRef = ref(db, 'private_chats/' + normalizeText(currentUserName));
                        onValue(privateRoomRef, (snapshot) => {
                            messagesDiv.innerHTML = '';
                            const msgs = snapshot.val();
                            if(msgs){
                                let sorted = Object.values(msgs).sort((a,b)=>a.timestamp - b.timestamp);
                                sorted.forEach(msg => {
                                    const msgDiv = document.createElement('div');
                                    msgDiv.className = msg.userId === myId ? 'message mine' : 'message';
                                    msgDiv.innerHTML = `<span class="name">${msg.name}</span><span class="text">${msg.text}</span>`;
                                    messagesDiv.appendChild(msgDiv);
                                });
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            }
                        });
                    }

                    // إرسال إيميل إشعار الدخول
                    const emailData = new URLSearchParams();
                    emailData.append('action', 'loginNotification');
                    emailData.append('name', currentUserName);
                    fetch(scriptUrl, {
                        method: 'POST',
                        body: emailData,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    }).catch(err => console.log("فشل إرسال الإشعار"));

                } else {
                    alert("لم يتم العثور على تطابق. تأكد من الاسم والباسورد.");
                    btn.innerText = "دخول";
                }
            } catch (error) {
                alert("حدث خطأ في الاتصال بالخادم.");
                document.querySelector('#loginScreen button').innerText = "دخول";
            }
        }

        window.sendMessage = function() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text) return;

            if (isAdmin) {
                const targetRoom = document.getElementById('adminUserSelect').value;
                if (!targetRoom) {
                    alert("الرجاء اختيار الموظف الذي تريد الرد عليه من القائمة.");
                    return;
                }
                const targetRef = ref(db, 'private_chats/' + targetRoom);
                push(targetRef, {
                    name: "الدعم الفني (الإدارة)", 
                    text: text,
                    userId: myId,
                    timestamp: serverTimestamp()
                });

                sendNotificationToUser(targetRoom, "وصلك رد جديد من الدعم الفني: " + text);

            } else {
                const privateRoomRef = ref(db, 'private_chats/' + normalizeText(currentUserName));
                push(privateRoomRef, {
                    name: currentUserName,
                    text: text,
                    userId: myId,
                    timestamp: serverTimestamp()
                });

                sendNotificationToUser(adminName, "رسالة جديدة من " + currentUserName + ": " + text);
            }
            document.getElementById('msgInput').value = '';
        };

        window.handleEnter = function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        };
    </script>
</body>
</html>
