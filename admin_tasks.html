<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة تعديل المهام والوظائف - مسئول النظام</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./logo.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            padding: 20px 14px 40px;
        }

        .top-bar {
            max-width: 1120px;
            margin: 0 auto 22px;
            background: rgba(15, 23, 42, 0.92);
            border: 1.5px solid rgba(251, 191, 36, 0.45);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand-box { display: flex; align-items: center; gap: 12px; }
        .brand-box img {
            width: 44px; height: 44px; border-radius: 50%;
            background: #fff; padding: 3px; border: 1.5px solid #fbbf24; object-fit: contain;
        }
        .brand-box h1 { font-size: 17px; font-weight: 900; color: #fbbf24; }
        .brand-box span { font-size: 12px; color: #cbd5e1; display: block; }

        .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-btn {
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.16); }
        .nav-btn.danger {
            background: rgba(239, 68, 68, 0.16);
            border-color: rgba(239, 68, 68, 0.45);
            color: #fca5a5;
        }

        .container { max-width: 1120px; margin: 0 auto; }

        .search-panel {
            position: relative;
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 22px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
        }

        .search-panel label {
            display: block;
            font-size: 14px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 10px;
        }

        .search-input-wrap { position: relative; display: flex; align-items: center; }
        .search-input-wrap i {
            position: absolute; right: 15px; color: #94a3b8; font-size: 15px; pointer-events: none;
        }
        .search-input-wrap input {
            width: 100%;
            padding: 13px 44px 13px 16px;
            border-radius: 12px;
            border: 1.5px solid rgba(148, 163, 184, 0.35);
            background: #0f172a;
            color: #fff;
            font-size: 14.5px;
            outline: none;
            transition: 0.2s;
        }
        .search-input-wrap input:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.18);
        }

        #suggestionsDropdown {
            position: absolute;
            top: calc(100% - 14px);
            left: 20px;
            right: 20px;
            background: #0f172a;
            border: 1.5px solid #fbbf24;
            border-radius: 12px;
            max-height: 260px;
            overflow-y: auto;
            z-index: 200;
            display: none;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.55);
        }

        .suggestion-item {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.14);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: 0.18s;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: rgba(251, 191, 36, 0.14); }
        .suggestion-name { font-weight: 800; color: #fff; font-size: 14px; }
        .suggestion-meta { font-size: 11.5px; color: #94a3b8; }

        .docs-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }

        .doc-card {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        }

        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding-bottom: 14px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            flex-wrap: wrap;
        }
        .doc-id-badge {
            background: rgba(251, 191, 36, 0.16);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.4);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
        }

        .section-sub-label {
            font-size: 12.5px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* صفان للحقول المحددة (3 في الأول و2 في الثاني) */
        .highlighted-fields-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .fields-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .field-box {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            transition: 0.2s;
        }
        .field-box.wide-field { grid-column: 1 / -1; }

        /* ألوان تمييز الحقول الخمسة المطلوبة */
        .field-box.tone-central-manager {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.55);
        }
        .field-box.tone-central-manager label { color: #7dd3fc; }

        .field-box.tone-type {
            background: rgba(168, 85, 247, 0.12);
            border-color: rgba(168, 85, 247, 0.55);
        }
        .field-box.tone-type label { color: #d8b4fe; }

        .field-box.tone-password {
            background: rgba(244, 63, 94, 0.12);
            border-color: rgba(244, 63, 94, 0.55);
        }
        .field-box.tone-password label { color: #fda4af; }

        .field-box.tone-department {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.55);
        }
        .field-box.tone-department label { color: #6ee7b7; }

        .field-box.tone-job-category {
            background: rgba(245, 158, 11, 0.14);
            border-color: rgba(245, 158, 11, 0.6);
        }
        .field-box.tone-job-category label { color: #fcd34d; }

        .field-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .field-box label {
            font-size: 12px;
            font-weight: 800;
            color: #cbd5e1;
            word-break: break-word;
        }

        .edit-pen-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid rgba(251, 191, 36, 0.35);
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            font-size: 12.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .edit-pen-btn:hover {
            background: rgba(251, 191, 36, 0.24);
        }
        .edit-pen-btn.editing {
            background: #10b981;
            border-color: #10b981;
            color: #0f172a;
        }

        .field-box input, .field-box textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: rgba(15, 23, 42, 0.78);
            color: #f8fafc;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        .field-box input[readonly], .field-box textarea[readonly] {
            opacity: 0.9;
            cursor: default;
        }
        .field-box input:not([readonly]), .field-box textarea:not([readonly]) {
            background: #0f172a;
            color: #ffffff;
            border-color: #fbbf24;
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.15);
            opacity: 1;
        }
        .field-box textarea { min-height: 90px; resize: vertical; }

        .save-doc-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 11px 22px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .save-doc-btn:hover { filter: brightness(1.08); }

        .status-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #fff;
            border: 1.5px solid #fbbf24;
            padding: 11px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            z-index: 9999;
            display: none;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
        }

        .empty-state {
            text-align: center;
            padding: 36px 20px;
            background: rgba(30, 41, 59, 0.65);
            border: 1px dashed rgba(148, 163, 184, 0.35);
            border-radius: 16px;
            color: #cbd5e1;
            font-size: 14px;
        }

        @media (max-width: 820px) {
            .highlighted-fields-grid {
                grid-template-columns: repeat(2, minmax(180px, 1fr));
            }
        }
        @media (max-width: 540px) {
            .highlighted-fields-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="statusToast" class="status-toast"></div>

    <div class="top-bar">
        <div class="brand-box">
            <img src="./logo.png" alt="شعار الهيئة">
            <div>
                <h1>لوحة تعديل المهام والوظائف</h1>
                <span id="adminSessionInfo">مسئول النظام</span>
            </div>
        </div>
        <div class="top-actions">
            <a href="./index.html" class="nav-btn"><i class="fas fa-home"></i> الرئيسية</a>
            <button type="button" class="nav-btn danger" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
    </div>

    <div class="container">
        <div class="search-panel">
            <label for="employeeSearchInput"><i class="fas fa-search"></i> ابحث عن موظف بالاسم (من أول حرف أو أول اسم)</label>
            <div class="search-input-wrap">
                <i class="fas fa-user-check"></i>
                <input type="text" id="employeeSearchInput" placeholder="اكتب أول حرف أو أول اسم للموظف..." oninput="handleSearchInput()" autocomplete="off">
            </div>
            <div id="suggestionsDropdown"></div>
        </div>

        <div id="documentsContainer" class="docs-grid">
            <div class="empty-state">ابدأ بكتابة أول حرف أو أول اسم من اسم الموظف لعرض المقترحات وجلب جميع حقول مستنداته من مجموعة <strong>users</strong>.</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const isAdminSession = sessionStorage.getItem("is_system_admin") === "true" &&
            String(sessionStorage.getItem("admin_role") || "").toLowerCase().includes("admin");

        if (!isAdminSession) {
            window.location.replace("./index.html");
        }

        const adminName = sessionStorage.getItem("admin_name") || sessionStorage.getItem("admin_username") || "مسئول النظام";
        document.getElementById("adminSessionInfo").textContent = `مسئول النظام: ${adminName}`;

        const purchasesFirebaseConfig = {
            apiKey: "PUT_YOUR_DAM_PURCHASES_API_KEY",
            authDomain: "dam-purchases-app.firebaseapp.com",
            projectId: "dam-purchases-app",
            storageBucket: "dam-purchases-app.firebasestorage.app",
            messagingSenderId: "PUT_SENDER_ID",
            appId: "PUT_YOUR_DAM_PURCHASES_APP_ID"
        };

        const app = initializeApp(purchasesFirebaseConfig, "damPurchasesTasksPanel");
        const db = getFirestore(app);

        let allUserDocs = [];
        const docFieldMetaMap = new Map();

        const TARGET_GROUP_KEYS = [
            "centralManager",
            "crntralManager",
            "type",
            "password",
            "department",
            "jobCategory"
        ];

        function showToast(msg, isError = false) {
            const el = document.getElementById("statusToast");
            el.textContent = msg;
            el.style.borderColor = isError ? "#ef4444" : "#fbbf24";
            el.style.display = "block";
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => {
                el.style.display = "none";
            }, 3200);
        }

        function normalizeArabic(text) {
            return String(text || "")
                .replace(/[أإآ]/g, "ا")
                .replace(/ة/g, "ه")
                .replace(/ى/g, "ي")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();
        }

        function getHighlightToneClass(key) {
            const k = String(key || "").trim();
            if (k === "centralManager" || k === "crntralManager") return "tone-central-manager";
            if (k === "type") return "tone-type";
            if (k === "password") return "tone-password";
            if (k === "department") return "tone-department";
            if (k === "jobCategory") return "tone-job-category";
            return "";
        }

        async function loadAllUsers() {
            try {
                const snap = await getDocs(collection(db, "users"));
                allUserDocs = snap.docs.map(d => ({ docId: d.id, data: d.data() || {} }));
            } catch (err) {
                console.error("Failed to fetch users collection:", err);
                showToast("تعذر جلب بيانات مجموعة users من قاعدة البيانات.", true);
            }
        }

        window.handleSearchInput = function() {
            const raw = document.getElementById("employeeSearchInput").value;
            const q = normalizeArabic(raw);
            const dropdown = document.getElementById("suggestionsDropdown");

            if (!q) {
                dropdown.style.display = "none";
                dropdown.innerHTML = "";
                return;
            }

            const matches = allUserDocs.filter(item => {
                const nameNorm = normalizeArabic(item.data.name || "");
                const firstNameNorm = nameNorm.split(" ")[0] || "";
                return nameNorm.startsWith(q) || firstNameNorm.startsWith(q) || nameNorm.includes(q);
            });

            if (matches.length === 0) {
                dropdown.innerHTML = `<div class="suggestion-item"><span class="suggestion-meta">لا توجد نتائج مطابقة</span></div>`;
                dropdown.style.display = "block";
                return;
            }

            dropdown.innerHTML = matches.map((m, idx) => `
                <div class="suggestion-item" onclick="selectEmployeeByIndex(${idx})">
                    <span class="suggestion-name">${m.data.name || m.docId}</span>
                    <span class="suggestion-meta">${m.data.department || m.data.jobCategory || m.docId}</span>
                </div>
            `).join("");

            window.__currentMatches = matches;
            dropdown.style.display = "block";
        };

        window.selectEmployeeByIndex = function(idx) {
            const matches = window.__currentMatches || [];
            const chosen = matches[idx];
            if (!chosen) return;

            document.getElementById("suggestionsDropdown").style.display = "none";
            document.getElementById("employeeSearchInput").value = chosen.data.name || chosen.docId;

            const chosenNormName = normalizeArabic(chosen.data.name || "");
            const matchingDocs = allUserDocs.filter(item => {
                if (chosenNormName) {
                    return normalizeArabic(item.data.name || "") === chosenNormName;
                }
                return item.docId === chosen.docId;
            });

            renderEmployeeDocuments(matchingDocs.length > 0 ? matchingDocs : [chosen]);
        };

        function formatFieldValueForDisplay(val) {
            if (val === null || val === undefined) return "";
            if (Array.isArray(val)) return val.join("\n");
            if (typeof val === "object") return JSON.stringify(val, null, 2);
            return String(val);
        }

        function parseFieldValueForSave(rawVal, originalVal) {
            if (typeof originalVal === "number") {
                const num = Number(rawVal.trim());
                return Number.isNaN(num) ? rawVal : num;
            }
            if (typeof originalVal === "boolean") {
                const lower = rawVal.trim().toLowerCase();
                if (lower === "true") return true;
                if (lower === "false") return false;
                return rawVal;
            }
            if (Array.isArray(originalVal)) {
                return rawVal
                    .split(/\r?\n/)
                    .map(line => line.trim())
                    .filter(Boolean);
            }
            if (originalVal !== null && typeof originalVal === "object") {
                try {
                    return JSON.parse(rawVal);
                } catch {
                    return rawVal;
                }
            }
            return rawVal;
        }

        function buildFieldCardHtml(docIdx, fieldIdx, key, val, forceCompact = false) {
            const displayVal = formatFieldValueForDisplay(val);
            const useTextarea = !forceCompact && (displayVal.includes("\n") || displayVal.length > 75 || key === "tasks");
            const inputId = `field_${docIdx}_${fieldIdx}`;
            const penBtnId = `pen_${docIdx}_${fieldIdx}`;
            const toneClass = getHighlightToneClass(key);

            const controlHtml = useTextarea
                ? `<textarea id="${inputId}" readonly>${escapeHtml(displayVal)}</textarea>`
                : `<input type="text" id="${inputId}" value="${escapeAttr(displayVal)}" readonly>`;

            return `
                <div class="field-box ${toneClass} ${useTextarea ? "wide-field" : ""}">
                    <div class="field-top-row">
                        <label for="${inputId}">${escapeHtml(key)}</label>
                        <button type="button" id="${penBtnId}" class="edit-pen-btn" title="تعديل ${escapeAttr(key)}" onclick="toggleFieldEdit('${inputId}', '${penBtnId}')">
                            <i class="fas fa-pen"></i>
                        </button>
                    </div>
                    ${controlHtml}
                </div>
            `;
        }

        function renderEmployeeDocuments(docsList) {
            const container = document.getElementById("documentsContainer");
            docFieldMetaMap.clear();

            if (!docsList || docsList.length === 0) {
                container.innerHTML = `<div class="empty-state">لم يتم العثور على مستندات لهذا الموظف.</div>`;
                return;
            }

            container.innerHTML = docsList.map((item, docIdx) => {
                const d = item.data || {};
                const allKeys = Object.keys(d);

                const highlightedEntries = [];
                TARGET_GROUP_KEYS.forEach((targetKey) => {
                    if (allKeys.includes(targetKey) && !highlightedEntries.some(e => e.key === targetKey)) {
                        highlightedEntries.push({ key: targetKey, val: d[targetKey] });
                    }
                });

                const otherEntries = allKeys
                    .filter(k => !TARGET_GROUP_KEYS.includes(k))
                    .map(k => ({ key: k, val: d[k] }));

                const orderedEntries = [...highlightedEntries, ...otherEntries];
                const orderedKeys = orderedEntries.map(e => e.key);
                docFieldMetaMap.set(docIdx, { docId: item.docId, keys: orderedKeys, originalData: d });

                let fieldCounter = 0;

                const highlightedHtml = highlightedEntries.length > 0
                    ? `
                        <div class="section-sub-label"><i class="fas fa-palette"></i> الحقول المميزة (الإدارة المركزية، النوع، كلمة المرور، الإدارة، الفئة الوظيفية)</div>
                        <div class="highlighted-fields-grid">
                            ${highlightedEntries.map(entry => {
                                const html = buildFieldCardHtml(docIdx, fieldCounter, entry.key, entry.val, true);
                                fieldCounter++;
                                return html;
                            }).join("")}
                        </div>
                    `
                    : "";

                const restHtml = otherEntries.length > 0
                    ? `
                        <div class="section-sub-label"><i class="fas fa-layer-group"></i> باقي حقول المستند</div>
                        <div class="fields-grid">
                            ${otherEntries.map(entry => {
                                const html = buildFieldCardHtml(docIdx, fieldCounter, entry.key, entry.val, false);
                                fieldCounter++;
                                return html;
                            }).join("")}
                        </div>
                    `
                    : "";

                return `
                    <div class="doc-card">
                        <div class="doc-header">
                            <div>
                                <strong>${escapeHtml(d.name || "بدون اسم")}</strong>
                                <span style="font-size: 12px; color: #94a3b8; margin-right: 8px;">(${escapeHtml(d.username || "")})</span>
                            </div>
                            <span class="doc-id-badge">مستند: ${escapeHtml(item.docId)}</span>
                        </div>

                        ${highlightedHtml}
                        ${restHtml || (!highlightedHtml ? `<div class="empty-state">هذا المستند لا يحتوي على حقول.</div>` : "")}

                        <button type="button" class="save-doc-btn" onclick="saveDocumentChanges(${docIdx})">
                            <i class="fas fa-save"></i> حفظ التعديلات في قاعدة البيانات
                        </button>
                    </div>
                `;
            }).join("");
        }

        window.toggleFieldEdit = function(inputId, penBtnId) {
            const fieldEl = document.getElementById(inputId);
            const penBtn = document.getElementById(penBtnId);
            if (!fieldEl || !penBtn) return;

            const isCurrentlyReadonly = fieldEl.hasAttribute("readonly");
            if (isCurrentlyReadonly) {
                fieldEl.removeAttribute("readonly");
                penBtn.classList.add("editing");
                penBtn.title = "جاري التعديل";
                fieldEl.focus();
            } else {
                fieldEl.setAttribute("readonly", "readonly");
                penBtn.classList.remove("editing");
                penBtn.title = "تعديل الحقل";
            }
        };

        function escapeAttr(val) {
            return String(val).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function escapeHtml(val) {
            return String(val).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.saveDocumentChanges = async function(docIdx) {
            const meta = docFieldMetaMap.get(docIdx);
            if (!meta) return;

            try {
                const updatedPayload = {};
                meta.keys.forEach((key, fieldIdx) => {
                    const el = document.getElementById(`field_${docIdx}_${fieldIdx}`);
                    if (!el) return;
                    updatedPayload[key] = parseFieldValueForSave(el.value, meta.originalData[key]);
                });

                await updateDoc(doc(db, "users", meta.docId), updatedPayload);

                meta.originalData = { ...meta.originalData, ...updatedPayload };
                const target = allUserDocs.find(u => u.docId === meta.docId);
                if (target) {
                    target.data = { ...target.data, ...updatedPayload };
                }

                meta.keys.forEach((_, fieldIdx) => {
                    const el = document.getElementById(`field_${docIdx}_${fieldIdx}`);
                    const penBtn = document.getElementById(`pen_${docIdx}_${fieldIdx}`);
                    if (el) el.setAttribute("readonly", "readonly");
                    if (penBtn) {
                        penBtn.classList.remove("editing");
                        penBtn.title = "تعديل الحقل";
                    }
                });

                showToast("تم حفظ جميع الحقول المعدّلة بنجاح في قاعدة البيانات.");
            } catch (err) {
                console.error("Update error:", err);
                showToast("تعذر حفظ التعديلات. تحقق من صلاحيات التعديل.", true);
            }
        };

        window.logoutAdmin = function() {
            sessionStorage.removeItem("is_system_admin");
            sessionStorage.removeItem("admin_role");
            sessionStorage.removeItem("admin_doc_id");
            sessionStorage.removeItem("admin_username");
            sessionStorage.removeItem("admin_name");
            window.location.replace("./index.html");
        };

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".search-panel")) {
                document.getElementById("suggestionsDropdown").style.display = "none";
            }
        });

        loadAllUsers();
    </script>
</body>
</html>
