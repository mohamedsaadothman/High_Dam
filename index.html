<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل الدخول - الهيئة العامة للسد العالي وخزان أسوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="./logo.png"> <!-- أيقونة المتصفح -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo-img {
            width: 80px; /* حجم اللوجو، يمكنك تعديله حسب رغبتك */
            height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .login-box h2 {
            margin-bottom: 5px;
            color: #1a365d;
            font-size: 22px;
        }
        .login-box p {
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            text-align: right;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #007bff;
        }
        .btn-login {
            width: 100%;
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #003d82;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- هنا مكان اللوجو -->
        <img src="./logo.png" alt="شعار الهيئة" class="logo-img">
        
        <h2>بوابة الموظفين</h2>
        <p>الهيئة العامة للسد العالي وخزان أسوان</p>
        
        <form onsubmit="doLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="user" placeholder="أدخل اسم المستخدم" required>
            </div>
            
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="pass" placeholder="أدخل كلمة المرور" required>
            </div>
            
            <button type="submit" class="btn-login">دخول</button>
        </form>
    </div>

<script>
    function doLogin(e) {
        e.preventDefault();
        let u = document.getElementById("user").value;
        alert("مرحباً بك يا " + u + " - جارٍ ربط النظام بالصلاحيات والإدارات...");
    }
</script>

</body>
</html>
