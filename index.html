<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الخدمات الرقمية - الهيئة العامة للسد العالي وخزان أسوان</title>
    <meta name="description" content="البوابة الرسمية للخدمات الرقمية وشؤون العاملين بالهيئة العامة للسد العالي وخزان أسوان.">
    <meta name="author" content="بوابة الخدمات الرقمية">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./logo.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body {
            background: linear-gradient(rgba(10, 25, 35, 0.55), rgba(15, 32, 39, 0.65)), url('./hig.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow-x: hidden;
            width: 100%;
        }
        .hidden { display: none !important; }

        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #c59b27;
            position: relative;
            z-index: 1000;
            width: 100%;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-area img { width: 40px; height: 40px; border-radius: 50%; object-fit: contain; background: #fff; padding: 2px; }
        .logo-area h1 { font-size: 15px; color: #fff; }
        .logo-area span { font-size: 10px; color: #94a3b8; display: block; }

        .header-actions { display: flex; align-items: center; gap: 8px; }
        
        .menu-toggle-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }
        .menu-toggle-btn:hover { background: #0056b3; }

        .apk-btn {
            background: #198754 !important;
            padding: 6px 10px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 3000; display: none;
        }
        .sidebar-overlay.active { display: block; }

        .sidebar-menu {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: #0f172a; z-index: 3500; transition: right 0.3s ease;
            display: flex; flex-direction: column; border-left: 2px solid #c59b27;
        }
        .sidebar-menu.active { right: 0; }

        .sidebar-header {
            padding: 15px; background: #1e293b; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #334155;
        }
        .sidebar-header h3 { color: #c59b27; font-size: 15px; }
        .close-sidebar { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }

        .sidebar-links {
            flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }
        .sidebar-links a {
            background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 12px; border-radius: 8px; text-align: right; font-size: 13px; font-weight: 600; cursor: pointer;
            width: 100%; display: flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .sidebar-links a:hover { background: #0056b3; }

        @keyframes textFloat3D {
            0% { transform: translateY(0px) scale(1); opacity: 0.95; }
            50% { transform: translateY(-6px) scale(1.01); opacity: 1; text-shadow: 0 15px 25px rgba(0,0,0,0.6); }
            100% { transform: translateY(0px) scale(1); opacity: 0.95; }
        }

        .main-hero {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px 20px;
        }
        .hero-title { 
            font-size: 30px; font-weight: 900; margin-bottom: 15px; color: #ffffff; 
            text-shadow: 0 3px 10px rgba(0,0,0,0.9);
            animation: textFloat3D 4s infinite ease-in-out;
        }
        .hero-subtitle { 
            font-size: 15px; color: #f1f5f9; margin-bottom: 35px; max-width: 700px; line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            animation: textFloat3D 4s infinite ease-in-out 1s;
        }

        .buttons-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; width: 100%; max-width: 600px; }
        .feature-card {
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 20px 15px; text-align: center; cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .feature-card:hover { transform: translateY(-4px); background: rgba(0, 86, 179, 0.9); }
        .feature-card i { font-size: 32px; color: #c59b27; margin-bottom: 10px; }
        .feature-card h4 { color: #ffffff; font-size: 14px; font-weight: 700; }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 8px; padding: 10px; text-align: center; }
            .logo-area { flex-direction: column; text-align: center; gap: 2px; }
            .header-actions { width: 100%; justify-content: center; }
            .hero-title { font-size: 20px; }
            .hero-subtitle { font-size: 13px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="./logo.png" alt="الشعار">
            <div>
                <h1>بوابة الخدمات الرقمية</h1>
                <span>الهيئة العامة للسد العالي وخزان أسوان</span>
            </div>
        </div>
        <div class="header-actions">
            <a href="./Mostahaqi.apk" class="apk-btn" download><i class="fas fa-download"></i> تحميل التطبيق</a>
            <button class="menu-toggle-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i> الإدارات</button>
        </div>
    </header>

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebarMenu" class="sidebar-menu">
        <div class="sidebar-header">
            <h3>قائمة الإدارات والخدمات</h3>
            <button class="close-sidebar" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-links">
            <a href="estihqaqat.html"><i class="fas fa-file-invoice-dollar" style="color: #c59b27;"></i> إدارة الاستحقاقات</a>
        </div>
    </div>

    <!-- الصفحة الرئيسية -->
    <main class="main-hero">
        <h2 class="hero-title">مرحباً بكم في البوابة الرقمية الرسمية</h2>
        <p class="hero-subtitle">منظومة إلكترونية متكاملة لخدمة العاملين بالهيئة العامة للسد العالي وخزان أسوان. انقر على القسم المطلوب للبدء.</p>
        
        <div class="buttons-grid">
            <a href="estihqaqat.html" class="feature-card">
                <i class="fas fa-file-invoice-dollar"></i>
                <h4>إدارة الاستحقاقات المالية</h4>
            </a>
        </div>
    </main>

<script>
    function toggleSidebar() {
        document.getElementById("sidebarMenu").classList.toggle("active");
        document.getElementById("sidebarOverlay").classList.toggle("active");
    }
</script>

</body>
</html>
