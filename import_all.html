<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مسح الحسابات</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body style="background:#1e293b; color:white; font-family:Arial; text-align:center; padding:50px;">
    <h2>مسح كل الحسابات من Firebase</h2>
    <button onclick="deleteUsers()" style="padding:15px 30px; font-size:20px; background:#dc3545; color:white; border:none; border-radius:8px; cursor:pointer;">🗑️ ابدأ المسح</button>
    <div id="msg" style="margin-top:20px; font-size:18px; color:yellow;">في انتظار البدء...</div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOp-FyI7gDM-8Dn7GAL9BXSbiuqbrLvzg",
            authDomain: "dam-purchases-app.firebaseapp.com",
            projectId: "dam-purchases-app",
            storageBucket: "dam-purchases-app.appspot.com",
            messagingSenderId: "123271128649",
            appId: "1:123271128649:web:1096b95fc97c8575b50198"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // هنستخدم إيميل الأدمن عشان نمسح الحسابات
        async function deleteUsers() {
            document.getElementById('msg').innerText = "جاري تسجيل الدخول...";
            try {
                // تسجيل دخول بحساب الأدمن عشان ناخد صلاحية المسح
                await auth.signInWithEmailAndPassword("admin@dam-app.com", "123456").catch(e => {
                    // لو مفيش أدمن، هنعمل حساب مؤقت
                    return auth.createUserWithEmailAndPassword("admin@dam-app.com", "123456");
                });
                
                document.getElementById('msg').innerText = "جاري المسح...";
                const idToken = await auth.currentUser.getIdToken();
                const apiKey = firebaseConfig.apiKey;
                
                let totalDeleted = 0;
                let hasMore = true;

                while (hasMore) {
                    // جلب قائمة المستخدمين (أقصى حد 1000 في المرة)
                    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/projects/${firebaseConfig.projectId}/accounts:batchGet?key=${apiKey}&maxResults=1000`, {
                        headers: { 'Authorization': 'Bearer ' + idToken }
                    });
                    const data = await res.json();
                    
                    if (data.users && data.users.length > 0) {
                        const uids = data.users.map(u => u.localId);
                        // مسح الدفعة دي
                        await fetch(`https://identitytoolkit.googleapis.com/v1/projects/${firebaseConfig.projectId}/accounts:batchDelete?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + idToken, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ localIds: uids })
                        });
                        totalDeleted += uids.length;
                        document.getElementById('msg').innerText = `تم مسح ${totalDeleted} حساب...`;
                    } else {
                        hasMore = false;
                    }
                }
                
                document.getElementById('msg').innerText = `✅ تم مسح ${totalDeleted} حساب بنجاح!`;
                document.getElementById('msg').style.color = "#4ade80";
                
            } catch (e) {
                document.getElementById('msg').innerText = "❌ خطأ: " + e.message;
                document.getElementById('msg').style.color = "#f87171";
            }
        }
    </script>
</body>
</html>
